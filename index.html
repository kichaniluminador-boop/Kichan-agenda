<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kichan Agenda">

<title>Kichan Agenda</title>

<link rel="manifest" href="./manifest.webmanifest">

<style>
:root{
  --gold:#e7b93f;
  --bg:#050505;
  --card:#141414;
  --field:#090909;
  --border:#303030;
  --text:#f5f5f5;
  --muted:#969696;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:110px;
}

.app{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:30px 20px;
}

/* CABECERA */

.brand{
  text-align:center;
  padding:15px 0 35px;
}

.crown{
  color:var(--gold);
  font-size:30px;
  margin-bottom:8px;
}

.brand-name{
  color:var(--gold);
  font-size:15px;
  font-weight:700;
  letter-spacing:6px;
}

.brand h1{
  margin:16px 0 6px;
  font-size:42px;
  letter-spacing:-1px;
}

.brand p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  letter-spacing:4px;
}

/* RESUMEN */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:22px;
}

.stat{
  min-width:0;
  padding:18px 5px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  text-align:center;
}

.stat strong{
  display:block;
  color:var(--gold);
  font-size:25px;
}

.stat span{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:9px;
  letter-spacing:1px;
}

/* BOTONES */

button{
  font:inherit;
  cursor:pointer;
}

.primary{
  width:100%;
  height:62px;
  border:0;
  border-radius:22px;
  background:var(--gold);
  color:#080808;
  font-weight:800;
  font-size:15px;
  letter-spacing:1px;
}

.section-title{
  margin:35px 4px 18px;
  color:var(--gold);
  font-size:12px;
  letter-spacing:3px;
}

/* EVENTOS */

.empty{
  padding:45px 15px;
  border:1px solid #242424;
  border-radius:25px;
  color:#777;
  text-align:center;
}

.event{
  margin-bottom:15px;
  padding:22px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:26px;
}

.event-date{
  color:var(--gold);
  font-size:13px;
  font-weight:700;
  text-transform:capitalize;
}

.event h3{
  margin:10px 0 5px;
  font-size:22px;
}

.event-place{
  color:#aaa;
  margin-bottom:18px;
}

.event-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.info{
  padding:12px;
  background:#090909;
  border-radius:15px;
}

.info small{
  display:block;
  color:#777;
  margin-bottom:4px;
}

.event-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.event-actions button{
  flex:1;
  border:1px solid #333;
  background:#0b0b0b;
  color:#ddd;
  padding:11px 5px;
  border-radius:14px;
}

/* FORMULARIO */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  overflow-y:auto;
  background:#050505;
  padding:env(safe-area-inset-top) 0 40px;
}

.overlay.open{
  display:block;
}

.form-page{
  width:100%;
  max-width:680px;
  margin:auto;
  padding:28px 20px;
}

.form-head{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:28px;
}

.back{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border:1px solid #333;
  border-radius:50%;
  background:#111;
  color:white;
  font-size:22px;
}

.form-head h2{
  margin:0;
  color:var(--gold);
  font-size:22px;
  letter-spacing:2px;
}

.form-card{
  width:100%;
  padding:24px 18px;
  border:1px solid var(--border);
  border-radius:28px;
  background:var(--card);
  overflow:hidden;
}

.field{
  width:100%;
  min-width:0;
  margin-bottom:19px;
}

.field label{
  display:block;
  margin:0 4px 8px;
  color:#aaa;
  font-size:13px;
}

.field input,
.field select,
.field textarea{
  display:block;
  width:100%;
  min-width:0;
  max-width:100%;
  margin:0;
  border:1px solid #383838;
  border-radius:17px;
  background:var(--field);
  color:white;
  font:inherit;
  font-size:16px;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
}

.field input,
.field select{
  height:58px;
  padding:0 15px;
}

.field textarea{
  height:100px;
  padding:16px;
  resize:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--gold);
}

.date-preview{
  margin:-8px 4px 19px;
  color:var(--gold);
  font-size:14px;
  text-transform:capitalize;
}

/*
  IMPORTANTE:
  Punto de encuentro + Hora salida.
  Flex evita el problema que teníamos con Grid/iPhone.
*/

.meeting-row{
  display:flex;
  width:100%;
  gap:10px;
  align-items:flex-start;
}

.meeting-point{
  flex:1 1 0;
  min-width:0;
}

.departure-time{
  flex:0 0 125px;
  width:125px;
  min-width:0;
}

.time-field{
  text-align:center;
  padding-left:5px !important;
  padding-right:5px !important;
}

.status-row{
  display:flex;
  width:100%;
  gap:10px;
}

.status-row .field{
  flex:1 1 0;
  min-width:0;
}

.save-row{
  display:flex;
  gap:10px;
  margin-top:8px;
}

.cancel,
.save{
  height:58px;
  border-radius:18px;
  font-weight:700;
}

.cancel{
  flex:1;
  border:1px solid #383838;
  background:#111;
  color:white;
}

.save{
  flex:2;
  border:0;
  background:var(--gold);
  color:#080808;
}

/* NAVEGACIÓN */

.nav{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  display:flex;
  width:calc(100% - 30px);
  max-width:500px;
  padding:8px;
  border:1px solid #292929;
  border-radius:24px;
  background:rgba(18,18,18,.96);
  backdrop-filter:blur(15px);
}

.nav button{
  flex:1;
  border:0;
  background:transparent;
  color:#777;
  padding:10px 3px;
  font-size:11px;
}

.nav button.active{
  color:var(--gold);
}

.nav-icon{
  display:block;
  margin-bottom:4px;
  font-size:20px;
}

/* OTRAS VISTAS */

.view{
  display:none;
}

.view.active{
  display:block;
}

.calendar-card,
.summary-card{
  padding:25px 20px;
  border:1px solid var(--border);
  border-radius:26px;
  background:var(--card);
}

.calendar-card h2,
.summary-card h2{
  margin-top:0;
  color:var(--gold);
}

.summary-line{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid #292929;
}

.summary-line:last-child{
  border-bottom:0;
}

.summary-line strong{
  color:var(--gold);
}

@media(max-width:390px){
  .app{
    padding-left:15px;
    padding-right:15px;
  }

  .form-page{
    padding-left:14px;
    padding-right:14px;
  }

  .form-card{
    padding-left:14px;
    padding-right:14px;
  }

  .departure-time{
    flex-basis:115px;
    width:115px;
  }
}
</style>
</head>

<body>

<main class="app">

  <section id="home" class="view active">

    <header class="brand">
      <div class="crown">♛</div>
      <div class="brand-name">KICHAN ILUMINADOR</div>
      <h1>Agenda</h1>
      <p>LUCES QUE HACEN HISTORIAS</p>
    </header>

    <div class="stats">
      <div class="stat">
        <strong id="totalEvents">0</strong>
        <span>EVENTOS</span>
      </div>

      <div class="stat">
        <strong id="monthEvents">0</strong>
        <span>ESTE MES</span>
      </div>

      <div class="stat">
        <strong id="nextEvent">—</strong>
        <span>PRÓXIMO</span>
      </div>
    </div>

    <button class="primary" onclick="openForm()">
      ＋ NUEVA PRESTACIÓN
    </button>

    <div class="section-title">PRÓXIMAS PRESTACIONES</div>

    <div id="eventList"></div>

  </section>

  <section id="calendar" class="view">

    <header class="brand">
      <div class="crown">♛</div>
      <div class="brand-name">KICHAN ILUMINADOR</div>
      <h1>Calendario</h1>
    </header>

    <div class="calendar-card">
      <h2 id="calendarTitle">Calendario</h2>
      <div id="calendarList"></div>
    </div>

  </section>

  <section id="summary" class="view">

    <header class="brand">
      <div class="crown">♛</div>
      <div class="brand-name">KICHAN ILUMINADOR</div>
      <h1>Resumen</h1>
    </header>

    <div class="summary-card">
      <h2>Prestaciones</h2>

      <div class="summary-line">
        <span>Total eventos</span>
        <strong id="sumTotal">0</strong>
      </div>

      <div class="summary-line">
        <span>Confirmados</span>
        <strong id="sumConfirmed">0</strong>
      </div>

      <div class="summary-line">
        <span>Pagados</span>
        <strong id="sumPaid">0</strong>
      </div>

      <div class="summary-line">
        <span>Pendientes</span>
        <strong id="sumPending">0</strong>
      </div>

      <div class="summary-line">
        <span>Total pagado</span>
        <strong id="sumMoneyPaid">$0</strong>
      </div>

      <div class="summary-line">
        <span>Por cobrar</span>
        <strong id="sumMoneyPending">$0</strong>
      </div>
    </div>

  </section>

</main>

<!-- FORMULARIO -->

<div id="formOverlay" class="overlay">

  <div class="form-page">

    <div class="form-head">
      <button class="back" type="button" onclick="closeForm()">‹</button>
      <h2 id="formTitle">NUEVA PRESTACIÓN</h2>
    </div>

    <form id="eventForm" class="form-card">

      <div class="field">
        <label>📅 Fecha</label>
        <input id="date" type="date" required>
      </div>

      <div id="datePreview" class="date-preview"></div>

      <div class="field">
        <label>🎵 Banda / Artista</label>
        <input id="artist" type="text" placeholder="Nombre de la banda o artista" required>
      </div>

      <div class="field">
        <label>📍 Localidad</label>
        <input id="location" type="text" placeholder="Ej: Coltauco">
      </div>

      <div class="meeting-row">

        <div class="field meeting-point">
          <label>📌 Punto de encuentro</label>
          <input id="meeting" type="text" placeholder="Ej: Casa Lambis">
        </div>

        <div class="field departure-time">
          <label>🚐 Hora salida</label>
          <input id="departure" class="time-field" type="time">
        </div>

      </div>

      <div class="field">
        <label>🎚️ Prueba de sonido</label>
        <input id="soundcheck" class="time-field" type="time">
      </div>

      <div class="field">
        <label>🎤 Hora show</label>
        <input id="showtime" class="time-field" type="time">
      </div>

      <div class="status-row">

        <div class="field">
          <label>✅ Estado</label>
          <select id="status">
            <option>Confirmado</option>
            <option>Por confirmar</option>
            <option>Reemplazo</option>
            <option>Cancelado</option>
          </select>
        </div>

        <div class="field">
          <label>💳 Pago</label>
          <select id="payment">
            <option>Pendiente</option>
            <option>Pagado</option>
          </select>
        </div>

      </div>

      <div class="field">
        <label>💰 Monto</label>
        <input id="amount" type="number" inputmode="numeric" placeholder="$">
      </div>

      <div class="field">
        <label>📝 Notas</label>
        <textarea id="notes" placeholder="Información adicional..."></textarea>
      </div>

      <div class="save-row">
        <button class="cancel" type="button" onclick="closeForm()">Cancelar</button>
        <button class="save" type="submit">Guardar</button>
      </div>

    </form>

  </div>
</div>

<!-- NAVEGACIÓN -->

<nav class="nav">

  <button id="navHome" class="active" onclick="showView('home')">
    <span class="nav-icon">⌂</span>
    Inicio
  </button>

  <button id="navCalendar" onclick="showView('calendar')">
    <span class="nav-icon">▣</span>
    Calendario
  </button>

  <button id="navSummary" onclick="showView('summary')">
    <span class="nav-icon">≡</span>
    Resumen
  </button>

</nav>

<script>

const STORAGE_KEY = "kichan-agenda-2026";

let events = [];
let editingId = null;

try{
  events = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
}catch(e){
  events = [];
}

const $ = id => document.getElementById(id);

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(events));
}

function money(value){
  return new Intl.NumberFormat("es-CL",{
    style:"currency",
    currency:"CLP",
    maximumFractionDigits:0
  }).format(Number(value)||0);
}

function longDate(date){
  if(!date) return "";

  const d = new Date(date+"T12:00:00");

  return d.toLocaleDateString("es-CL",{
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  });
}

function shortDate(date){
  if(!date) return "—";

  const d = new Date(date+"T12:00:00");

  return d.toLocaleDateString("es-CL",{
    day:"2-digit",
    month:"2-digit"
  });
}

function openForm(id=null){

  editingId=id;

  $("eventForm").reset();

  if(id){

    const e=events.find(x=>x.id===id);

    if(!e) return;

    $("formTitle").textContent="EDITAR PRESTACIÓN";

    $("date").value=e.date||"";
    $("artist").value=e.artist||"";
    $("location").value=e.location||"";
    $("meeting").value=e.meeting||"";
    $("departure").value=e.departure||"";
    $("soundcheck").value=e.soundcheck||"";
    $("showtime").value=e.showtime||"";
    $("status").value=e.status||"Confirmado";
    $("payment").value=e.payment||"Pendiente";
    $("amount").value=e.amount||"";
    $("notes").value=e.notes||"";

  }else{

    $("formTitle").textContent="NUEVA PRESTACIÓN";

    const today=new Date();
    const y=today.getFullYear();
    const m=String(today.getMonth()+1).padStart(2,"0");
    const d=String(today.getDate()).padStart(2,"0");

    $("date").value=`${y}-${m}-${d}`;
  }

  updateDatePreview();

  $("formOverlay").classList.add("open");

  document.body.style.overflow="hidden";
}

function closeForm(){
  $("formOverlay").classList.remove("open");
  document.body.style.overflow="";
  editingId=null;
}

function updateDatePreview(){
  $("datePreview").textContent=longDate($("date").value);
}

$("date").addEventListener("change",updateDatePreview);

$("eventForm").addEventListener("submit",function(ev){

  ev.preventDefault();

  const data={
    id:editingId || Date.now(),
    date:$("date").value,
    artist:$("artist").value.trim(),
    location:$("location").value.trim(),
    meeting:$("meeting").value.trim(),
    departure:$("departure").value,
    soundcheck:$("soundcheck").value,
    showtime:$("showtime").value,
    status:$("status").value,
    payment:$("payment").value,
    amount:Number($("amount").value)||0,
    notes:$("notes").value.trim()
  };

  if(editingId){
    events=events.map(x=>x.id===editingId ? data : x);
  }else{
    events.push(data);
  }

  saveData();
  closeForm();
  render();
});

function deleteEvent(id){

  if(!confirm("¿Eliminar esta prestación?")) return;

  events=events.filter(x=>x.id!==id);

  saveData();
  render();
}

function duplicateEvent(id){

  const source=events.find(x=>x.id===id);

  if(!source) return;

  events.push({
    ...source,
    id:Date.now()
  });

  saveData();
  render();
}

function eventCard(e){

  return `
    <article class="event">

      <div class="event-date">
        ${longDate(e.date)}
      </div>

      <h3>${escapeHTML(e.artist)}</h3>

      <div class="event-place">
        📍 ${escapeHTML(e.location || "Sin localidad")}
      </div>

      <div class="event-info">

        <div class="info">
          <small>📌 Punto de encuentro</small>
          ${escapeHTML(e.meeting || "—")}
        </div>

        <div class="info">
          <small>🚐 Hora salida</small>
          ${e.departure || "—"}
        </div>

        <div class="info">
          <small>🎚️ Prueba de sonido</small>
          ${e.soundcheck || "—"}
        </div>

        <div class="info">
          <small>🎤 Hora show</small>
          ${e.showtime || "—"}
        </div>

      </div>

      <div class="event-actions">

        <button onclick="openForm(${e.id})">
          Editar
        </button>

        <button onclick="duplicateEvent(${e.id})">
          Duplicar
        </button>

        <button onclick="deleteEvent(${e.id})">
          Eliminar
        </button>

      </div>

    </article>
  `;
}

function escapeHTML(value){

  return String(value||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function render(){

  events.sort((a,b)=>
    (a.date||"").localeCompare(b.date||"")
  );

  const today=new Date();
  today.setHours(0,0,0,0);

  const upcoming=events.filter(e=>{
    if(!e.date) return false;
    return new Date(e.date+"T12:00:00") >= today;
  });

  $("totalEvents").textContent=events.length;

  const month=today.getMonth();
  const year=today.getFullYear();

  const monthEvents=events.filter(e=>{
    if(!e.date) return false;
    const d=new Date(e.date+"T12:00:00");
    return d.getMonth()===month && d.getFullYear()===year;
  });

  $("monthEvents").textContent=monthEvents.length;

  $("nextEvent").textContent=
    upcoming.length ? shortDate(upcoming[0].date) : "—";

  $("eventList").innerHTML=
    upcoming.length
      ? upcoming.map(eventCard).join("")
      : `<div class="empty">No hay prestaciones próximas</div>`;

  renderCalendar();
  renderSummary();
}

function renderCalendar(){

  const months=[
    "Enero","Febrero","Marzo","Abril","Mayo","Junio",
    "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
  ];

  const now=new Date();

  $("calendarTitle").textContent=
    `${months[now.getMonth()]} ${now.getFullYear()}`;

  const list=events.filter(e=>{
    if(!e.date) return false;

    const d=new Date(e.date+"T12:00:00");

    return d.getMonth()===now.getMonth() &&
           d.getFullYear()===now.getFullYear();
  });

  $("calendarList").innerHTML=
    list.length
      ? list.map(e=>`
          <div class="summary-line">
            <span>
              ${shortDate(e.date)} · ${escapeHTML(e.artist)}
            </span>
            <strong>${e.showtime || "—"}</strong>
          </div>
        `).join("")
      : `<div class="empty">No hay prestaciones este mes</div>`;
}

function renderSummary(){

  const confirmed=
    events.filter(e=>e.status==="Confirmado").length;

  const paid=
    events.filter(e=>e.payment==="Pagado").length;

  const pending=
    events.filter(e=>e.payment==="Pendiente").length;

  const moneyPaid=
    events
      .filter(e=>e.payment==="Pagado")
      .reduce((sum,e)=>sum+(Number(e.amount)||0),0);

  const moneyPending=
    events
      .filter(e=>e.payment==="Pendiente")
      .reduce((sum,e)=>sum+(Number(e.amount)||0),0);

  $("sumTotal").textContent=events.length;
  $("sumConfirmed").textContent=confirmed;
  $("sumPaid").textContent=paid;
  $("sumPending").textContent=pending;
  $("sumMoneyPaid").textContent=money(moneyPaid);
  $("sumMoneyPending").textContent=money(moneyPending);
}

function showView(view){

  document.querySelectorAll(".view")
    .forEach(v=>v.classList.remove("active"));

  $(view).classList.add("active");

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  if(view==="home"){
    $("navHome").classList.add("active");
  }

  if(view==="calendar"){
    $("navCalendar").classList.add("active");
  }

  if(view==="summary"){
    $("navSummary").classList.add("active");
  }

  window.scrollTo(0,0);
}

render();

</script>

</body>
</html>
