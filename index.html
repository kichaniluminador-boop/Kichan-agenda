<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kichan Agenda">

<title>Kichan Agenda</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./kichan-icon-512.png">

<style>
:root{
  --bg:#050505;
  --card:#151515;
  --field:#090909;
  --line:#343434;
  --gold:#efbd37;
  --gold2:#b88a25;
  --text:#f5f5f5;
  --muted:#969696;
  --danger:#e05a5a;
  --green:#35c66b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top) + 18px)
    18px
    calc(110px + env(safe-area-inset-bottom));
}

.view{
  display:none;
}

.view.active{
  display:block;
}

/* CABECERAS */

.brand{
  text-align:center;
  color:var(--gold2);
  font-size:14px;
  font-weight:800;
  letter-spacing:7px;
  margin:12px 0 46px;
}

.page-title{
  margin:0 0 30px;
  text-align:center;
  font-size:48px;
  line-height:.95;
  letter-spacing:-2px;
  font-weight:800;
}

.page-subtitle{
  margin:-16px 0 28px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  letter-spacing:3px;
  font-weight:700;
  text-transform:uppercase;
}

/* INICIO */

.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-bottom:22px;
}

.stat{
  min-width:0;
  padding:20px 5px;
  border:1px solid var(--line);
  border-radius:24px;
  background:var(--card);
  text-align:center;
}

.stat-number{
  color:var(--gold);
  font-size:30px;
  font-weight:800;
}

.stat-label{
  margin-top:8px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
}

.primary{
  width:100%;
  border:0;
  border-radius:22px;
  background:var(--gold);
  color:#080808;
  padding:18px 12px;
  font-weight:900;
  font-size:17px;
}

.section-title{
  margin:34px 5px 18px;
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase;
}

.event-mini{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  margin-bottom:12px;
}

.event-mini-date{
  color:var(--gold);
  font-weight:800;
  font-size:14px;
}

.event-mini h3{
  margin:8px 0 4px;
  font-size:22px;
}

.event-mini-place{
  color:var(--muted);
  font-size:17px;
}

.mini-times{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:14px;
  color:#bdbdbd;
  font-size:14px;
}

/* FORMULARIO */

.form-card{
  width:100%;
  margin:0 auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  padding:20px 16px;
}

.field{
  width:100%;
  min-width:0;
  margin-bottom:16px;
}

.field label{
  display:block;
  margin:0 6px 7px;
  color:#aaa;
  font-size:13px;
  line-height:1.25;
  font-weight:800;
  letter-spacing:.4px;
}

.control{
  display:block;
  width:100%;
  min-width:0;
  height:52px;
  margin:0;
  padding:0 15px;
  border:1px solid #414141;
  border-radius:18px;
  outline:none;
  background:var(--field);
  color:var(--text);
  font-size:16px;
  appearance:none;
  -webkit-appearance:none;
}

.control:focus{
  border-color:var(--gold);
}

textarea.control{
  height:90px;
  padding:14px 15px;
  resize:vertical;
}

input[type="date"].control{
  text-align:center;
}

input[type="time"].control{
  height:48px;
  padding:0 10px;
  text-align:center;
  min-width:0;
}

.meeting-row{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(0,.75fr);
  gap:10px;
  width:100%;
  align-items:end;
}

.time-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
  width:100%;
  align-items:end;
}

.status-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
  width:100%;
}

.meeting-row > *,
.time-row > *,
.status-row > *{
  min-width:0;
}

.compact-field{
  margin-bottom:14px;
}

.compact-field .control{
  height:48px;
}

.money-wrap{
  position:relative;
}

.money-wrap::before{
  content:"$";
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--gold);
  font-weight:800;
  pointer-events:none;
}

.money-wrap .control{
  padding-left:32px;
}

.date-preview{
  margin:-2px 5px 14px;
  color:var(--gold);
  font-size:14px;
  font-weight:800;
  text-align:center;
}

.form-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.action{
  min-height:50px;
  border:1px solid #444;
  border-radius:18px;
  background:#252525;
  color:var(--gold);
  font-weight:800;
  font-size:14px;
}

.action.save{
  background:var(--gold);
  color:#090909;
  border-color:var(--gold);
}

.action.danger{
  color:#ff8b8b;
}

/* CALENDARIO */

.calendar-box{
  border:1px solid var(--line);
  border-radius:26px;
  background:var(--card);
  padding:16px 12px;
}

.calendar-head{
  display:grid;
  grid-template-columns:42px 1fr 42px;
  align-items:center;
  gap:8px;
  margin-bottom:16px;
}

.calendar-head button{
  height:42px;
  border:1px solid #444;
  border-radius:14px;
  background:#202020;
  color:var(--gold);
  font-size:22px;
}

.calendar-month{
  text-align:center;
  font-size:20px;
  font-weight:800;
  text-transform:capitalize;
}

.weekdays,
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
}

.weekday{
  padding:5px 0;
  text-align:center;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.day{
  position:relative;
  aspect-ratio:1/1;
  min-width:0;
  border:1px solid transparent;
  border-radius:12px;
  background:#0c0c0c;
  color:#ddd;
  font-size:13px;
}

.day.blank{
  visibility:hidden;
}

.day.has-event{
  color:#050505;
  background:var(--gold);
  font-weight:900;
}

.day.today{
  border-color:#fff;
}

.day.selected{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

.selected-date-title{
  margin:24px 2px 14px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  letter-spacing:2px;
  font-weight:800;
  text-transform:uppercase;
}

/* DETALLES */

.detail-card{
  background:#080808;
  border:1px solid var(--line);
  border-radius:26px;
  padding:20px;
  margin-bottom:14px;
}

.detail-card h3{
  margin:0 0 18px;
  font-size:23px;
}

.detail-row{
  padding:11px 0;
  border-bottom:1px solid #242424;
}

.detail-label{
  display:block;
  color:#888;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.detail-value{
  font-size:16px;
  overflow-wrap:anywhere;
}

.notes-box{
  margin-top:16px;
  padding:16px;
  border-left:4px solid var(--gold);
  border-radius:16px;
  background:#171717;
}

.notes-box strong{
  display:block;
  color:var(--gold);
  margin-bottom:8px;
}

.quick-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:16px;
}

.quick-btn{
  border:1px solid #444;
  border-radius:15px;
  background:#242424;
  color:var(--gold);
  min-height:44px;
  padding:9px 13px;
  font-size:12px;
  font-weight:800;
}

.quick-btn.call{
  color:#9be7b5;
}

.quick-btn.whatsapp{
  color:#83e6a5;
}

.detail-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding-top:16px;
  margin-top:16px;
  border-top:1px solid #292929;
}

.detail-actions button{
  min-height:48px;
  border:1px solid #444;
  border-radius:16px;
  background:#242424;
  color:var(--gold);
  font-weight:800;
}

.detail-actions .delete{
  color:#ff8585;
}

/* RESUMEN */

.summary-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.summary-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px 12px;
  text-align:center;
}

.summary-card.full{
  grid-column:1/-1;
}

.summary-number{
  color:var(--gold);
  font-size:27px;
  font-weight:900;
}

.summary-label{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  margin-top:6px;
}

.tools{
  margin-top:24px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--card);
}

.tools h3{
  margin:0 0 14px;
  text-align:center;
}

.tool-buttons{
  display:grid;
  gap:10px;
}

.tool-btn{
  min-height:50px;
  border:1px solid #444;
  border-radius:16px;
  background:#242424;
  color:var(--gold);
  font-weight:800;
}

#importFile{
  display:none;
}

/* BARRA INFERIOR */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:calc(10px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(calc(100% - 28px),400px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:10px;
  background:rgba(20,20,20,.96);
  border:1px solid #353535;
  border-radius:26px;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.nav-btn{
  border:0;
  background:transparent;
  color:#777;
  padding:8px 3px;
  font-size:11px;
}

.nav-btn span{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.nav-btn.active{
  color:var(--gold);
}

.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:360px){
  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .page-title{
    font-size:42px;
  }

  .form-card{
    padding-left:12px;
    padding-right:12px;
  }

  .meeting-row{
    grid-template-columns:minmax(0,1.35fr) minmax(0,.75fr);
    gap:7px;
  }

  .time-row,
  .status-row{
    gap:7px;
  }

  .control{
    padding-left:10px;
    padding-right:10px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<main class="app">

<section id="homeView" class="view active">
  <div class="brand">KICHAN ILUMINADOR</div>
  <h1 class="page-title">Agenda</h1>

  <div class="stats">
    <div class="stat">
      <div id="statTotal" class="stat-number">0</div>
      <div class="stat-label">Prestaciones</div>
    </div>
    <div class="stat">
      <div id="statMonth" class="stat-number">0</div>
      <div class="stat-label">Este mes</div>
    </div>
    <div class="stat">
      <div id="statNext" class="stat-number">—</div>
      <div class="stat-label">Próxima</div>
    </div>
  </div>

  <button id="newEventBtn" class="primary">+ NUEVA PRESTACIÓN</button>

  <div class="section-title">Próximas prestaciones</div>
  <div id="upcomingList"></div>
</section>

<section id="calendarView" class="view">
  <div class="brand">KICHAN ILUMINADOR</div>
  <h1 class="page-title">Calendario</h1>

  <div class="calendar-box">
    <div class="calendar-head">
      <button id="prevMonth" type="button">‹</button>
      <div id="calendarMonth" class="calendar-month"></div>
      <button id="nextMonth" type="button">›</button>
    </div>

    <div class="weekdays">
      <div class="weekday">L</div>
      <div class="weekday">M</div>
      <div class="weekday">X</div>
      <div class="weekday">J</div>
      <div class="weekday">V</div>
      <div class="weekday">S</div>
      <div class="weekday">D</div>
    </div>

    <div id="calendarGrid" class="calendar-grid"></div>
  </div>

  <div id="selectedDateTitle" class="selected-date-title"></div>
  <div id="selectedDateEvents"></div>
</section>

<section id="summaryView" class="view">
  <div class="brand">KICHAN ILUMINADOR</div>
  <h1 class="page-title">Resumen</h1>

  <div class="summary-grid">
    <div class="summary-card">
      <div id="sumTotal" class="summary-number">0</div>
      <div class="summary-label">Prestaciones</div>
    </div>

    <div class="summary-card">
      <div id="sumConfirmed" class="summary-number">0</div>
      <div class="summary-label">Confirmadas</div>
    </div>

    <div class="summary-card">
      <div id="sumPaid" class="summary-number">0</div>
      <div class="summary-label">Pagadas</div>
    </div>

    <div class="summary-card">
      <div id="sumPending" class="summary-number">0</div>
      <div class="summary-label">Pendientes</div>
    </div>

    <div class="summary-card full">
      <div id="sumPaidMoney" class="summary-number">$0</div>
      <div class="summary-label">Total pagado</div>
    </div>

    <div class="summary-card full">
      <div id="sumPendingMoney" class="summary-number">$0</div>
      <div class="summary-label">Por cobrar</div>
    </div>
  </div>

  <div class="tools">
    <h3>Respaldo de agenda</h3>
    <div class="tool-buttons">
      <button id="exportBtn" class="tool-btn" type="button">⬇️ CREAR RESPALDO</button>
      <button id="importBtn" class="tool-btn" type="button">⬆️ IMPORTAR RESPALDO</button>
      <input id="importFile" type="file" accept=".json,application/json">
    </div>
  </div>
</section>

<section id="formView" class="view">
  <div class="brand">KICHAN ILUMINADOR</div>
  <h1 id="formTitle" class="page-title">Nueva prestación</h1>

  <form id="eventForm" class="form-card">

    <div class="field">
      <label for="date">📅 FECHA</label>
      <input id="date" class="control" type="date" required>
    </div>
    <div id="datePreview" class="date-preview"></div>

    <div class="field">
      <label for="artist">🎤 BANDA / ARTISTA</label>
      <input id="artist" class="control" type="text" autocomplete="off" required>
    </div>

    <div class="field">
      <label for="place">📍 LOCALIDAD / LUGAR</label>
      <input id="place" class="control" type="text" autocomplete="off">
    </div>

    <div class="meeting-row">
      <div class="field compact-field">
        <label for="meeting">📌 PUNTO DE ENCUENTRO</label>
        <input id="meeting" class="control" type="text" autocomplete="off">
      </div>

      <div class="field compact-field">
        <label for="departure">🚌 SALIDA</label>
        <input id="departure" class="control" type="time">
      </div>
    </div>

    <div class="time-row">
      <div class="field compact-field">
        <label for="test">🎚️ PRUEBA</label>
        <input id="test" class="control" type="time">
      </div>

      <div class="field compact-field">
        <label for="show">🎤 SHOW</label>
        <input id="show" class="control" type="time">
      </div>
    </div>

    <div class="field">
      <label for="contact">👤 CONTACTO</label>
      <input id="contact" class="control" type="text" placeholder="Nombre del contacto" autocomplete="off">
    </div>

    <div class="field">
      <label for="phone">📱 TELÉFONO</label>
      <input id="phone" class="control" type="tel" placeholder="+56 9 1234 5678" autocomplete="tel">
    </div>

    <div class="status-row">
      <div class="field compact-field">
        <label for="status">✅ ESTADO</label>
        <select id="status" class="control">
          <option value="Confirmado">Confirmado</option>
          <option value="Reemplazo">Reemplazo</option>
          <option value="Por confirmar">Por confirmar</option>
          <option value="Cancelado">Cancelado</option>
        </select>
      </div>

      <div class="field compact-field">
        <label for="payment">💰 PAGO</label>
        <select id="payment" class="control">
          <option value="Pendiente">Pendiente</option>
          <option value="Pagado">Pagado</option>
        </select>
      </div>
    </div>

    <div class="field compact-field">
      <label for="amount">💵 MONTO</label>
      <div class="money-wrap">
        <input id="amount" class="control" type="text" inputmode="numeric" placeholder="0">
      </div>
    </div>

    <div class="field">
      <label for="notes">📝 NOTAS</label>
      <textarea id="notes" class="control" placeholder="Información adicional"></textarea>
    </div>

    <div class="form-actions">
      <button id="cancelFormBtn" class="action" type="button">CANCELAR</button>
      <button class="action save" type="submit">💾 GUARDAR</button>
    </div>

  </form>
</section>

</main>

<nav id="bottomNav" class="bottom-nav">
  <button class="nav-btn active" data-view="home" type="button">
    <span>⌂</span>Inicio
  </button>

  <button class="nav-btn" data-view="calendar" type="button">
    <span>▣</span>Calendario
  </button>

  <button class="nav-btn" data-view="summary" type="button">
    <span>☰</span>Resumen
  </button>
</nav>

<script>
"use strict";

/*
  BASE COMPLETAMENTE NUEVA.
  No se leen claves antiguas para impedir que reaparezcan duplicados.
*/
const STORAGE_KEY = "kichan-agenda-clean-v1";

const state = {
  events: [],
  view: "home",
  editingId: null,
  returnView: "home",
  selectedDate: "",
  calendarYear: new Date().getFullYear(),
  calendarMonth: new Date().getMonth()
};

const $ = id => document.getElementById(id);

function makeId(){
  return Date.now().toString() + "-" + Math.random().toString(36).slice(2,8);
}

function cleanText(value){
  return String(value ?? "").trim();
}

function normalizeDate(value){
  const text = cleanText(value);

  if(/^\d{4}-\d{2}-\d{2}$/.test(text)){
    return text;
  }

  const match = text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);

  if(match){
    const day = match[1].padStart(2,"0");
    const month = match[2].padStart(2,"0");
    return `${match[3]}-${month}-${day}`;
  }

  return "";
}

function numericAmount(value){
  if(typeof value === "number" && Number.isFinite(value)){
    return Math.max(0,Math.round(value));
  }

  const digits = String(value ?? "").replace(/\D/g,"");
  return digits ? Number(digits) : 0;
}

function formatMoney(value){
  const number = numericAmount(value);
  return "$" + new Intl.NumberFormat("es-CL",{
    maximumFractionDigits:0
  }).format(number);
}

function formatAmountInput(value){
  const number = numericAmount(value);
  return number
    ? new Intl.NumberFormat("es-CL",{maximumFractionDigits:0}).format(number)
    : "";
}

function parseLocalDate(dateString){
  const parts = normalizeDate(dateString).split("-");

  if(parts.length !== 3){
    return null;
  }

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2]),
    12,0,0
  );
}

function formatDateShort(dateString){
  const date = parseLocalDate(dateString);
  if(!date) return "";

  return new Intl.DateTimeFormat("es-CL",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  }).format(date);
}

function formatDateWithWeekday(dateString){
  const date = parseLocalDate(dateString);
  if(!date) return "";

  let weekday = new Intl.DateTimeFormat("es-CL",{
    weekday:"long"
  }).format(date);

  weekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);

  const day = String(date.getDate()).padStart(2,"0");
  const month = String(date.getMonth()+1).padStart(2,"0");
  const year = date.getFullYear();

  return `${weekday} ${day}-${month}-${year}`;
}

function normalizeEvent(raw){
  if(!raw || typeof raw !== "object"){
    return null;
  }

  const date = normalizeDate(raw.date ?? raw.fecha);

  const artist = cleanText(
    raw.artist ??
    raw.artista ??
    raw.band ??
    raw.banda ??
    raw.nombre
  );

  if(!date || !artist){
    return null;
  }

  return {
    id: cleanText(raw.id) || makeId(),
    date,
    artist,
    place: cleanText(raw.place ?? raw.location ?? raw.localidad ?? raw.lugar),
    meeting: cleanText(raw.meeting ?? raw.meetingPoint ?? raw.puntoEncuentro ?? raw.encuentro),
    departure: cleanText(raw.departure ?? raw.salida ?? raw.horaSalida ?? raw.arrival),
    test: cleanText(raw.test ?? raw.soundcheck ?? raw.prueba ?? raw.horaPrueba),
    show: cleanText(raw.show ?? raw.showtime ?? raw.horaShow),
    contact: cleanText(raw.contact ?? raw.contacto ?? raw.contactName),
    phone: cleanText(raw.phone ?? raw.telefono ?? raw.tel),
    status: cleanText(raw.status ?? raw.estado) || "Confirmado",
    payment: cleanText(raw.payment ?? raw.pago) || "Pendiente",
    amount: numericAmount(raw.amount ?? raw.monto),
    notes: cleanText(raw.notes ?? raw.notas)
  };
}

function sortEvents(events){
  return events.slice().sort((a,b)=>{
    const dateCompare = a.date.localeCompare(b.date);
    if(dateCompare !== 0) return dateCompare;

    const timeA = a.show || a.departure || "99:99";
    const timeB = b.show || b.departure || "99:99";

    return timeA.localeCompare(timeB);
  });
}

function loadEvents(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];

    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) return [];

    return sortEvents(
      parsed
        .map(normalizeEvent)
        .filter(Boolean)
    );
  }catch(error){
    return [];
  }
}

function saveEvents(){
  state.events = sortEvents(state.events);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state.events));
}

function eventSignature(event){
  return [
    event.date,
    event.artist.toUpperCase(),
    event.place.toUpperCase(),
    event.meeting.toUpperCase(),
    event.departure,
    event.test,
    event.show,
    event.amount,
    event.notes.toUpperCase()
  ].join("|");
}

function removeExactDuplicates(events){
  const seen = new Set();
  const result = [];

  for(const event of events){
    const signature = eventSignature(event);

    if(seen.has(signature)){
      continue;
    }

    seen.add(signature);
    result.push(event);
  }

  return result;
}

function showView(view){
  state.view = view;

  document.querySelectorAll(".view").forEach(element=>{
    element.classList.remove("active");
  });

  const target = $(view + "View");
  if(target){
    target.classList.add("active");
  }

  document.querySelectorAll(".nav-btn").forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.view === view
    );
  });

  $("bottomNav").style.display =
    view === "form" ? "none" : "grid";

  if(view === "home"){
    renderHome();
  }

  if(view === "calendar"){
    renderCalendar();
  }

  if(view === "summary"){
    renderSummary();
  }

  window.scrollTo(0,0);
}

function renderHome(){
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth()+1;

  const monthPrefix =
    `${year}-${String(month).padStart(2,"0")}`;

  $("statTotal").textContent = state.events.length;

  $("statMonth").textContent =
    state.events.filter(event=>
      event.date.startsWith(monthPrefix)
    ).length;

  const today =
    `${year}-${String(month).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

  const upcoming = sortEvents(
    state.events.filter(event=>event.date >= today)
  );

  if(upcoming.length){
    const nextDate = parseLocalDate(upcoming[0].date);
    $("statNext").textContent =
      String(nextDate.getDate()).padStart(2,"0");
  }else{
    $("statNext").textContent = "—";
  }

  const container = $("upcomingList");
  container.innerHTML = "";

  if(!upcoming.length){
    container.innerHTML =
      '<div class="empty">No hay próximas prestaciones.</div>';
    return;
  }

  upcoming.slice(0,12).forEach(event=>{
    const card = document.createElement("div");
    card.className = "event-mini";

    const date = document.createElement("div");
    date.className = "event-mini-date";
    date.textContent = formatDateWithWeekday(event.date);

    const title = document.createElement("h3");
    title.textContent = event.artist;

    const place = document.createElement("div");
    place.className = "event-mini-place";
    place.textContent = event.place || "Sin localidad";

    card.append(date,title,place);

    const times = document.createElement("div");
    times.className = "mini-times";

    if(event.departure){
      const item = document.createElement("span");
      item.textContent = "🚌 " + event.departure;
      times.appendChild(item);
    }

    if(event.test){
      const item = document.createElement("span");
      item.textContent = "🎚️ " + event.test;
      times.appendChild(item);
    }

    if(event.show){
      const item = document.createElement("span");
      item.textContent = "🎤 " + event.show;
      times.appendChild(item);
    }

    if(times.children.length){
      card.appendChild(times);
    }

    card.addEventListener("click",()=>{
      const date = parseLocalDate(event.date);

      state.selectedDate = event.date;
      state.calendarYear = date.getFullYear();
      state.calendarMonth = date.getMonth();

      showView("calendar");
    });

    container.appendChild(card);
  });
}

function renderCalendar(){
  const year = state.calendarYear;
  const month = state.calendarMonth;

  $("calendarMonth").textContent =
    new Intl.DateTimeFormat("es-CL",{
      month:"long",
      year:"numeric"
    }).format(new Date(year,month,1));

  const grid = $("calendarGrid");
  grid.innerHTML = "";

  const firstDay = new Date(year,month,1).getDay();
  const firstOffset = (firstDay + 6) % 7;
  const daysInMonth = new Date(year,month+1,0).getDate();

  for(let i=0;i<firstOffset;i++){
    const blank = document.createElement("button");
    blank.className = "day blank";
    blank.type = "button";
    grid.appendChild(blank);
  }

  const now = new Date();

  for(let day=1;day<=daysInMonth;day++){
    const dateString =
      `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "day";
    button.textContent = day;

    if(state.events.some(event=>event.date === dateString)){
      button.classList.add("has-event");
    }

    if(
      now.getFullYear() === year &&
      now.getMonth() === month &&
      now.getDate() === day
    ){
      button.classList.add("today");
    }

    if(state.selectedDate === dateString){
      button.classList.add("selected");
    }

    button.addEventListener("click",()=>{
      state.selectedDate = dateString;
      renderCalendar();
    });

    grid.appendChild(button);
  }

  renderSelectedDate();
}

function addDetailRow(card,label,value){
  if(!value) return;

  const row = document.createElement("div");
  row.className = "detail-row";

  const labelElement = document.createElement("span");
  labelElement.className = "detail-label";
  labelElement.textContent = label;

  const valueElement = document.createElement("div");
  valueElement.className = "detail-value";
  valueElement.textContent = value;

  row.append(labelElement,valueElement);
  card.appendChild(row);
}

function mapButton(label,query){
  const button = document.createElement("button");
  button.type = "button";
  button.className = "quick-btn";
  button.textContent = label;

  button.addEventListener("click",()=>{
    const destination = encodeURIComponent(query);
    window.open(
      "https://maps.apple.com/?q=" + destination,
      "_blank"
    );
  });

  return button;
}

function phoneDigits(phone){
  let value = String(phone || "").trim();

  if(!value) return "";

  const hasPlus = value.startsWith("+");
  value = value.replace(/\D/g,"");

  return hasPlus ? "+" + value : value;
}

function whatsappDigits(phone){
  let value = String(phone || "").replace(/\D/g,"");

  if(!value) return "";

  if(value.startsWith("9") && value.length === 9){
    value = "56" + value;
  }

  return value;
}

function renderSelectedDate(){
  const title = $("selectedDateTitle");
  const container = $("selectedDateEvents");

  container.innerHTML = "";

  if(!state.selectedDate){
    title.textContent = "Selecciona un día";
    return;
  }

  title.textContent =
    "Prestaciones · " +
    formatDateWithWeekday(state.selectedDate);

  const events = state.events.filter(
    event=>event.date === state.selectedDate
  );

  if(!events.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No hay prestaciones este día.";
    container.appendChild(empty);

    const add = document.createElement("button");
    add.className = "primary";
    add.type = "button";
    add.textContent = "+ AGREGAR PRESTACIÓN";
    add.addEventListener("click",()=>{
      openNewForm(state.selectedDate,"calendar");
    });

    container.appendChild(add);
    return;
  }

  events.forEach(event=>{
    const card = document.createElement("article");
    card.className = "detail-card";

    const heading = document.createElement("h3");
    heading.textContent = event.artist;
    card.appendChild(heading);

    addDetailRow(
      card,
      "📅 FECHA",
      formatDateWithWeekday(event.date)
    );

    addDetailRow(card,"📍 LOCALIDAD",event.place);
    addDetailRow(card,"📌 PUNTO DE ENCUENTRO",event.meeting);
    addDetailRow(card,"🚌 SALIDA",event.departure);
    addDetailRow(card,"🎚️ PRUEBA DE SONIDO",event.test);
    addDetailRow(card,"🎤 HORA SHOW",event.show);
    addDetailRow(card,"👤 CONTACTO",event.contact);
    addDetailRow(card,"📱 TELÉFONO",event.phone);
    addDetailRow(card,"✅ ESTADO",event.status);
    addDetailRow(card,"💰 PAGO",event.payment);
    addDetailRow(card,"💵 MONTO",formatMoney(event.amount));

    if(event.notes){
      const notes = document.createElement("div");
      notes.className = "notes-box";

      const strong = document.createElement("strong");
      strong.textContent = "📝 NOTAS";

      const text = document.createElement("div");
      text.textContent = event.notes;

      notes.append(strong,text);
      card.appendChild(notes);
    }

    const quick = document.createElement("div");
    quick.className = "quick-actions";

    if(event.place){
      quick.appendChild(
        mapButton("🗺️ CÓMO LLEGAR · LOCALIDAD",event.place)
      );
    }

    if(event.meeting){
      quick.appendChild(
        mapButton("📌 CÓMO LLEGAR · ENCUENTRO",event.meeting)
      );
    }

    if(event.phone){
      const call = document.createElement("button");
      call.type = "button";
      call.className = "quick-btn call";
      call.textContent = "📞 LLAMAR";

      call.addEventListener("click",()=>{
        const number = phoneDigits(event.phone);
        if(number){
          window.location.href = "tel:" + number;
        }
      });

      quick.appendChild(call);

      const whatsapp = document.createElement("button");
      whatsapp.type = "button";
      whatsapp.className = "quick-btn whatsapp";
      whatsapp.textContent = "💬 WHATSAPP";

      whatsapp.addEventListener("click",()=>{
        const number = whatsappDigits(event.phone);

        if(number){
          window.open(
            "https://wa.me/" + number,
            "_blank"
          );
        }
      });

      quick.appendChild(whatsapp);
    }

    if(quick.children.length){
      card.appendChild(quick);
    }

    const actions = document.createElement("div");
    actions.className = "detail-actions";

    const edit = document.createElement("button");
    edit.type = "button";
    edit.textContent = "✏️ EDITAR";

    edit.addEventListener("click",()=>{
      openEditForm(event.id,"calendar");
    });

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "delete";
    remove.textContent = "🗑️ ELIMINAR";

    remove.addEventListener("click",()=>{
      deleteEvent(event.id);
    });

    actions.append(edit,remove);
    card.appendChild(actions);

    container.appendChild(card);
  });

  const addAnother = document.createElement("button");
  addAnother.className = "primary";
  addAnother.type = "button";
  addAnother.textContent = "+ AGREGAR OTRA PRESTACIÓN";

  addAnother.addEventListener("click",()=>{
    openNewForm(state.selectedDate,"calendar");
  });

  container.appendChild(addAnother);
}

function renderSummary(){
  const confirmed = state.events.filter(
    event=>event.status === "Confirmado"
  ).length;

  const paidEvents = state.events.filter(
    event=>event.payment === "Pagado"
  );

  const pendingEvents = state.events.filter(
    event=>event.payment !== "Pagado"
  );

  const paidMoney = paidEvents.reduce(
    (total,event)=>total + numericAmount(event.amount),
    0
  );

  const pendingMoney = pendingEvents.reduce(
    (total,event)=>total + numericAmount(event.amount),
    0
  );

  $("sumTotal").textContent = state.events.length;
  $("sumConfirmed").textContent = confirmed;
  $("sumPaid").textContent = paidEvents.length;
  $("sumPending").textContent = pendingEvents.length;
  $("sumPaidMoney").textContent = formatMoney(paidMoney);
  $("sumPendingMoney").textContent = formatMoney(pendingMoney);
}

function clearForm(){
  $("eventForm").reset();

  $("status").value = "Confirmado";
  $("payment").value = "Pendiente";
  $("datePreview").textContent = "";
  $("amount").value = "";
}

function openNewForm(date="",returnView="home"){
  state.editingId = null;
  state.returnView = returnView;

  clearForm();

  $("formTitle").textContent = "Nueva prestación";

  if(date){
    $("date").value = date;
    updateDatePreview();
  }

  showView("form");
}

function openEditForm(id,returnView="calendar"){
  const event = state.events.find(
    item=>String(item.id) === String(id)
  );

  if(!event) return;

  state.editingId = event.id;
  state.returnView = returnView;

  $("formTitle").textContent = "Editar prestación";

  $("date").value = event.date;
  $("artist").value = event.artist;
  $("place").value = event.place;
  $("meeting").value = event.meeting;
  $("departure").value = event.departure;
  $("test").value = event.test;
  $("show").value = event.show;
  $("contact").value = event.contact || "";
  $("phone").value = event.phone || "";
  $("status").value = event.status;
  $("payment").value = event.payment;
  $("amount").value = formatAmountInput(event.amount);
  $("notes").value = event.notes;

  updateDatePreview();
  showView("form");
}

function updateDatePreview(){
  const date = $("date").value;

  $("datePreview").textContent =
    date ? formatDateWithWeekday(date) : "";
}

function saveForm(event){
  event.preventDefault();

  const date = normalizeDate($("date").value);
  const artist = cleanText($("artist").value);

  if(!date || !artist){
    alert("Debes ingresar la fecha y la banda / artista.");
    return;
  }

  const record = {
    id: state.editingId || makeId(),
    date,
    artist,
    place: cleanText($("place").value),
    meeting: cleanText($("meeting").value),
    departure: cleanText($("departure").value),
    test: cleanText($("test").value),
    show: cleanText($("show").value),
    contact: cleanText($("contact").value),
    phone: cleanText($("phone").value),
    status: $("status").value,
    payment: $("payment").value,
    amount: numericAmount($("amount").value),
    notes: cleanText($("notes").value)
  };

  if(state.editingId){
    const index = state.events.findIndex(
      item=>String(item.id) === String(state.editingId)
    );

    if(index >= 0){
      state.events[index] = record;
    }
  }else{
    state.events.push(record);
  }

  saveEvents();

  state.selectedDate = record.date;

  const localDate = parseLocalDate(record.date);

  state.calendarYear = localDate.getFullYear();
  state.calendarMonth = localDate.getMonth();

  state.editingId = null;

  renderAll();

  if(state.returnView === "calendar"){
    showView("calendar");
  }else{
    showView("home");
  }
}

function deleteEvent(id){
  const event = state.events.find(
    item=>String(item.id) === String(id)
  );

  if(!event) return;

  const accepted = confirm(
    `¿Eliminar la prestación de ${event.artist} del ${formatDateShort(event.date)}?`
  );

  if(!accepted) return;

  state.events = state.events.filter(
    item=>String(item.id) !== String(id)
  );

  saveEvents();
  renderAll();
  showView("calendar");
}

function exportBackup(){
  const backup = {
    app:"KICHAN AGENDA",
    version:2,
    fecha:new Date().toISOString(),
    events:state.events
  };

  const blob = new Blob(
    [JSON.stringify(backup,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  const now = new Date();
  const stamp =
    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

  link.href = url;
  link.download = `KICHAN-AGENDA-${stamp}.json`;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);
}

function importBackup(file){
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(){
    try{
      const parsed = JSON.parse(reader.result);

      const source =
        Array.isArray(parsed)
          ? parsed
          : Array.isArray(parsed.events)
            ? parsed.events
            : null;

      if(!source){
        throw new Error("Formato inválido");
      }

      let imported = source
        .map(normalizeEvent)
        .filter(Boolean);

      if(!imported.length){
        throw new Error("No hay prestaciones válidas");
      }

      imported = removeExactDuplicates(imported);

      /*
        IMPORTACIÓN LIMPIA:
        reemplaza la base nueva completa.
        No mezcla el respaldo con datos antiguos.
      */
      const accepted = confirm(
        `El respaldo contiene ${imported.length} prestaciones válidas.\n\n¿Reemplazar la agenda actual por este respaldo?`
      );

      if(!accepted){
        $("importFile").value = "";
        return;
      }

      /*
        Garantiza IDs únicos incluso si un respaldo antiguo
        tuviera IDs repetidos.
      */
      const usedIds = new Set();

      imported = imported.map(event=>{
        let id = cleanText(event.id);

        if(!id || usedIds.has(id)){
          id = makeId();
        }

        usedIds.add(id);

        return {
          ...event,
          id
        };
      });

      state.events = sortEvents(imported);
      saveEvents();

      state.selectedDate = "";

      renderAll();
      showView("home");

      alert(
        `Respaldo importado correctamente.\n${state.events.length} prestaciones cargadas.`
      );

    }catch(error){
      alert(
        "No se pudo importar el respaldo. Verifica que sea un archivo JSON de Kichan Agenda."
      );
    }

    $("importFile").value = "";
  };

  reader.readAsText(file);
}

function renderAll(){
  renderHome();
  renderCalendar();
  renderSummary();
}

document.querySelectorAll(".nav-btn").forEach(button=>{
  button.addEventListener("click",()=>{
    showView(button.dataset.view);
  });
});

$("newEventBtn").addEventListener("click",()=>{
  openNewForm("","home");
});

$("prevMonth").addEventListener("click",()=>{
  state.calendarMonth--;

  if(state.calendarMonth < 0){
    state.calendarMonth = 11;
    state.calendarYear--;
  }

  state.selectedDate = "";
  renderCalendar();
});

$("nextMonth").addEventListener("click",()=>{
  state.calendarMonth++;

  if(state.calendarMonth > 11){
    state.calendarMonth = 0;
    state.calendarYear++;
  }

  state.selectedDate = "";
  renderCalendar();
});

$("date").addEventListener("change",updateDatePreview);

$("amount").addEventListener("input",()=>{
  const digits = $("amount").value.replace(/\D/g,"");

  $("amount").value =
    digits
      ? new Intl.NumberFormat("es-CL").format(Number(digits))
      : "";
});

$("eventForm").addEventListener("submit",saveForm);

$("cancelFormBtn").addEventListener("click",()=>{
  state.editingId = null;
  showView(state.returnView || "home");
});

$("exportBtn").addEventListener("click",exportBackup);

$("importBtn").addEventListener("click",()=>{
  $("importFile").click();
});

$("importFile").addEventListener("change",()=>{
  const file = $("importFile").files[0];
  importBackup(file);
});

state.events = loadEvents();

renderAll();
showView("home");

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker
      .register("./sw.js")
      .catch(()=>{});
  });
}
</script>
