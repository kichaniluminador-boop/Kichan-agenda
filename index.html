<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kichan Agenda">

<title>Kichan Agenda</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./kichan-icon-512.png">

<style>
:root{
  --bg:#050505;
  --card:#141414;
  --field:#080808;
  --line:#333;
  --gold:#efbd37;
  --gold2:#b18a25;
  --text:#f5f5f5;
  --muted:#969696;
  --danger:#e05a5a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Helvetica Neue",Arial,sans-serif;
}

body{
  padding-top:max(18px,env(safe-area-inset-top));
  padding-bottom:max(110px,env(safe-area-inset-bottom));
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

.app{
  width:min(100%,760px);
  margin:auto;
  padding:24px 20px 145px;
}

.brand{
  text-align:center;
  color:var(--gold2);
  font-weight:900;
  letter-spacing:7px;
  font-size:14px;
  margin:12px 0 28px;
}

h1{
  margin:0 0 34px;
  font-size:clamp(48px,12vw,78px);
  line-height:.95;
  letter-spacing:-3px;
}

h2{
  margin:0 0 18px;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

.sectionTitle{
  color:#999;
  letter-spacing:2.5px;
  font-size:13px;
  margin:32px 5px 14px;
  font-weight:800;
}

/* BOTONES */

.primary,
.secondary,
.danger{
  width:100%;
  border:0;
  border-radius:20px;
  min-height:58px;
  padding:14px 18px;
  font-weight:900;
}

.primary{
  background:var(--gold);
  color:#050505;
}

.secondary{
  background:#292929;
  color:#fff;
}

.danger{
  background:#351616;
  color:#ff8585;
  border:1px solid #6b2929;
}

.smallBtn{
  border:1px solid #3c3c3c;
  background:#242424;
  color:var(--gold);
  border-radius:14px;
  padding:10px 13px;
  min-height:42px;
  font-size:12px;
  font-weight:900;
}

/* INICIO */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}

.stat{
  background:var(--card);
  border:1px solid #292929;
  border-radius:22px;
  padding:17px 8px;
  text-align:center;
}

.stat strong{
  display:block;
  color:var(--gold);
  font-size:25px;
}

.stat span{
  color:#888;
  font-size:10px;
}

.eventCard{
  background:var(--card);
  border:1px solid #303030;
  border-radius:24px;
  padding:19px;
  margin:11px 0;
}

.eventDate{
  color:var(--gold);
  font-size:13px;
  font-weight:900;
}

.eventArtist{
  font-size:21px;
  font-weight:900;
  margin:6px 0;
}

.eventPlace{
  color:#aaa;
  overflow-wrap:anywhere;
}

.miniTimes{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:13px;
  color:#bbb;
  font-size:13px;
}

.empty{
  color:#777;
  text-align:center;
  padding:30px 10px;
}

/* FORMULARIO */

.formCard{
  background:var(--card);
  border:1px solid #333;
  border-radius:28px;
  padding:22px;
}

.field{
  margin-bottom:20px;
  min-width:0;
}

label{
  display:block;
  color:#999;
  font-size:13px;
  margin:0 7px 8px;
  font-weight:700;
}

input,
select,
textarea{
  display:block;
  width:100%;
  min-width:0;
  max-width:100%;
  background:var(--field);
  border:1px solid #3b3b3b;
  color:#fff;
  border-radius:18px;
  padding:14px 15px;
  min-height:56px;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--gold);
}

.meetingRow{
  display:grid;
  grid-template-columns:minmax(0,1fr) 122px;
  gap:12px;
  align-items:end;
}

.timeRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.formActions{
  display:grid;
  gap:11px;
  margin-top:24px;
}

/* CALENDARIO */

.calendarCard{
  background:var(--card);
  border:1px solid #333;
  border-radius:28px;
  padding:21px 16px;
}

.calHeader{
  display:grid;
  grid-template-columns:54px 1fr 54px;
  gap:10px;
  align-items:center;
  margin-bottom:20px;
}

.calHeader button{
  height:54px;
  border:1px solid #3b3b3b;
  background:#080808;
  color:var(--gold);
  border-radius:17px;
  font-size:30px;
}

.calTitle{
  color:var(--gold);
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.weekdays,
.calendarGrid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
}

.weekdays div{
  color:#888;
  text-align:center;
  padding:7px 0;
  font-size:13px;
  font-weight:900;
}

.day{
  position:relative;
  border:0;
  background:#070707;
  color:#fff;
  border-radius:14px;
  aspect-ratio:1/1;
  min-width:0;
  font-size:16px;
}

.day.blank{
  visibility:hidden;
}

.day.hasEvent{
  background:var(--gold);
  color:#050505;
  font-weight:900;
}

.day.today{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

.day.selected{
  box-shadow:inset 0 0 0 3px #fff;
}

.eventDot{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#050505;
  bottom:6px;
  left:50%;
  transform:translateX(-50%);
}

.dayDetails{
  margin-top:23px;
  border-top:1px solid #303030;
  padding-top:19px;
}

/* DETALLES */

.detailCard{
  background:#090909;
  border:1px solid #303030;
  border-radius:22px;
  padding:18px;
  margin:12px 0;
}

.detailArtist{
  color:#fff;
  font-size:22px;
  font-weight:900;
  margin-bottom:14px;
}

.detailRow{
  padding:9px 0;
  border-bottom:1px solid #222;
}

.detailLabel{
  color:#777;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:4px;
}

.detailValue{
  color:#eee;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.quickActions,
.editActions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.editActions{
  padding-top:14px;
  border-top:1px solid #282828;
}

.notesBox{
  margin-top:14px;
  background:#151515;
  border-left:3px solid var(--gold);
  border-radius:15px;
  padding:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.notesBox strong{
  display:block;
  color:var(--gold);
  margin-bottom:7px;
}

/* RESUMEN */

.summaryCard{
  background:var(--card);
  border:1px solid #303030;
  border-radius:27px;
  padding:20px;
}

.summaryLine{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:17px 0;
  border-bottom:1px solid #292929;
  text-align:left;
}

.summaryLine:last-child{
  border-bottom:0;
}

.summaryLine strong{
  color:var(--gold);
  font-size:20px;
}

.summaryLine.clickable{
  cursor:pointer;
}

.summaryLine.clickable::after{
  content:"›";
  color:var(--gold);
  font-size:25px;
}

.summaryLine.clickable strong{
  margin-left:auto;
}

.backupCard{
  background:var(--card);
  border:1px solid #303030;
  border-radius:27px;
  padding:20px;
  margin-top:20px;
}

.backupButtons{
  display:grid;
  gap:10px;
}

/* PANEL */

.sheet{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.76);
  padding:18px;
  align-items:flex-end;
  justify-content:center;
}

.sheet.open{
  display:flex;
}

.sheetBox{
  width:min(100%,700px);
  max-height:86vh;
  overflow:auto;
  background:#151515;
  border:1px solid #3a3a3a;
  border-radius:28px;
  padding:22px;
  padding-bottom:max(22px,env(safe-area-inset-bottom));
}

/* NAV */

.bottomNav{
  position:fixed;
  z-index:50;
  left:50%;
  transform:translateX(-50%);
  bottom:max(12px,env(safe-area-inset-bottom));
  width:min(calc(100% - 28px),700px);
  height:84px;
  background:#111;
  border:1px solid #303030;
  border-radius:28px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:7px;
}

.navBtn{
  border:0;
  background:transparent;
  color:#777;
  border-radius:19px;
  font-size:12px;
}

.navBtn span{
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

.navBtn.active{
  color:var(--gold);
}

@media(max-width:380px){
  .app{
    padding-left:15px;
    padding-right:15px;
  }

  .formCard{
    padding:17px;
  }

  .meetingRow{
    grid-template-columns:minmax(0,1fr) 110px;
    gap:8px;
  }

  .timeRow,
  .two{
    gap:8px;
  }

  .calendarCard{
    padding-left:11px;
    padding-right:11px;
  }

  .calendarGrid,
  .weekdays{
    gap:4px;
  }
}
</style>
</head>

<body>

<div class="app">

<div class="brand">KICHAN ILUMINADOR</div>

<!-- INICIO -->

<section id="homeView" class="view active">

<h1>Agenda</h1>

<div class="stats">
  <div class="stat">
    <strong id="statTotal">0</strong>
    <span>PRESTACIONES</span>
  </div>

  <div class="stat">
    <strong id="statMonth">0</strong>
    <span>ESTE MES</span>
  </div>

  <div class="stat">
    <strong id="statNext">—</strong>
    <span>PRÓXIMA</span>
  </div>
</div>

<button id="newEventBtn" class="primary" type="button">
+ NUEVA PRESTACIÓN
</button>

<div class="sectionTitle">PRÓXIMAS PRESTACIONES</div>
<div id="homeList"></div>

</section>

<!-- CALENDARIO -->

<section id="calendarView" class="view">

<h1>Calendario</h1>

<div class="calendarCard">

<div class="calHeader">
  <button id="prevMonth" type="button">‹</button>
  <div id="calendarTitle" class="calTitle"></div>
  <button id="nextMonth" type="button">›</button>
</div>

<div class="weekdays">
  <div>L</div><div>M</div><div>X</div>
  <div>J</div><div>V</div><div>S</div><div>D</div>
</div>

<div id="calendarGrid" class="calendarGrid"></div>

<div id="dayDetails" class="dayDetails"></div>

</div>

<div class="sectionTitle">PRESTACIONES DEL MES</div>
<div id="monthList"></div>

</section>

<!-- RESUMEN -->

<section id="summaryView" class="view">

<h1>Resumen</h1>

<div class="summaryCard">

<div class="summaryLine">
  <span>📋 PRESTACIONES</span>
  <strong id="sumTotal">0</strong>
</div>

<div class="summaryLine">
  <span>✅ CONFIRMADAS</span>
  <strong id="sumConfirmed">0</strong>
</div>

<div class="summaryLine">
  <span>🔄 REEMPLAZOS</span>
  <strong id="sumReplace">0</strong>
</div>

<button id="paidButton" class="summaryLine clickable" type="button">
  <span>💰 PAGADAS</span>
  <strong id="sumPaid">0</strong>
</button>

<button id="pendingButton" class="summaryLine clickable" type="button">
  <span>⌛ PENDIENTES DE PAGO</span>
  <strong id="sumPending">0</strong>
</button>

<div class="summaryLine">
  <span>💵 TOTAL PAGADO</span>
  <strong id="sumPaidMoney">$0</strong>
</div>

<div class="summaryLine">
  <span>🧾 POR COBRAR</span>
  <strong id="sumPendingMoney">$0</strong>
</div>

</div>

<div class="backupCard">

<div class="sectionTitle" style="margin-top:0">
RESPALDO DE SEGURIDAD
</div>

<div class="backupButtons">

<button id="exportBackup" class="secondary" type="button">
⬇️ EXPORTAR RESPALDO
</button>

<button id="restoreBackup" class="secondary" type="button">
⬆️ RESTAURAR RESPALDO
</button>

<input
  id="backupFile"
  type="file"
  accept=".json,application/json"
  style="display:none"
>

</div>
</div>

</section>

<!-- FORMULARIO -->

<section id="formView" class="view">

<h1 id="formTitle">Nueva<br>prestación</h1>

<form id="eventForm" class="formCard">

<div class="field">
<label for="fDate">📅 FECHA</label>
<input id="fDate" type="date" required>
</div>

<div class="field">
<label for="fArtist">🎤 BANDA / ARTISTA</label>
<input id="fArtist" class="uppercase" type="text" required>
</div>

<div class="field">
<label for="fPlace">📍 LOCALIDAD / LUGAR</label>
<input id="fPlace" class="uppercase" type="text">
</div>

<div class="meetingRow">

<div class="field">
<label for="fMeeting">📌 PUNTO DE ENCUENTRO</label>
<input id="fMeeting" class="uppercase" type="text">
</div>

<div class="field">
<label for="fDeparture">🚌 SALIDA</label>
<input id="fDeparture" type="time">
</div>

</div>

<div class="timeRow">

<div class="field">
<label for="fTest">🎚️ PRUEBA</label>
<input id="fTest" type="time">
</div>

<div class="field">
<label for="fShow">🎤 SHOW</label>

</div>

<div class="field">
<label for="fContactName">👤 CONTACTO</label>
<input
  id="fContactName"
  class="uppercase"

>

<div class="field">
<label for="fContactPhone">📱 TELÉFONO</label>
<input
  id="fContactPhone"
  type="tel"

  placeholder="+56 9 1234 5678"
>
</div>

<div class="two">

<div class="field">
<label for="fStatus">✅ ESTADO</label>
<select id="fStatus">
<option>Confirmado</option>
<option>Por confirmar</option>
<option>Reemplazo</option>
<option>Cancelado</option>
</select>

<div class="field">
<label for="fPayment">💰 PAGO</label>
<select id="fPayment">
<option>Pendiente</option>
<option>Pagado</option>
</select>
</div>

</div>

<div class="field">
<label for="fAmount">💵 MONTO $</label>
<input id="fAmount" type="number" min="0" inputmode="numeric">
</div>

<div class="field">
<label for="fNotes">📝 NOTAS</label>

  id="fNotes"
  class="uppercase"
  placeholder="INFORMACIÓN ADICIONAL..."
></textarea>
</div>

<div class="formActions">

<button class="primary" type="submit">
💾 GUARDAR
</button>

<button id="cancelForm" class="secondary" type="button">
CANCELAR
</button>

🗑️ ELIMINAR
</button>

</div>

</form>
</section>

</div>

<!-- PANEL -->

<div id="sheet" class="sheet">
<div class="sheetBox">

<h2 id="sheetTitle"></h2>
<div id="sheetContent"></div>

<div style="height:12px"></div>

<button id="closeSheet" class="secondary" type="button">
CERRAR
</button>

<nav id="bottomNav" class="bottomNav">

Inicio

<span>▣</span>
Calendario
</button>

<button class="navBtn" data-view="summary" type="button">
<span>≡</span>
Resumen
</button>

</nav>

<script>
"use strict";

const STORAGE_KEY = "kichan-agenda-data-v4";

const $ = id => document.getElementById(id);

const state = {
  events:[],
  editingId:null,
  currentView:"home",
  returnView:"home",
  selectedDate:"",
  calendarYear:new Date().getFullYear(),
  calendarMonth:new Date().getMonth()
};

/* =========================
   UTILIDADES
========================= */

function makeId(){
  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID();
  }

  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function firstValue(obj,keys,fallback=""){
  for(const key of keys){
    if(
      obj[key] !== undefined &&
      obj[key] !== null &&
      obj[key] !== ""
    ){
      return obj[key];
    }
  }
  return fallback;
}

function normalizeDate(value){
  if(!value) return "";

  const text = String(value).trim();

  if(/^\d{4}-\d{2}-\d{2}/.test(text)){
    return text.slice(0,10);
  }

  const m = text.match(
    /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/
  );

  if(m){
    return (
      m[3] + "-" +
      String(m[2]).padStart(2,"0") + "-" +
      String(m[1]).padStart(2,"0")
    );
  }

  return "";
}

function normalizeEvent(raw){
  const e = raw || {};

  return {
    id:String(firstValue(e,["id","ID","uid"],makeId())),

    date:normalizeDate(
      firstValue(e,["date","fecha"])
    ),

    artist:String(
      firstValue(
        e,
        ["artist","artista","band","banda","name","nombre"]
      )
    ).toUpperCase(),

    place:String(
      firstValue(
        e,
        ["place","location","localidad","lugar"]
      )
    ).toUpperCase(),

    meeting:String(
      firstValue(
        e,
        [
          "meeting",
          "meetingPoint",
          "puntoEncuentro",
          "punto",
          "encuentro"
        ]
      )
    ).toUpperCase(),

    departure:String(
      firstValue(
        e,
        ["departure","salida","arrival","horaSalida"]
      )
    ),

    test:String(
      firstValue(
        e,
        ["test","soundcheck","prueba","horaPrueba"]
      )
    ),

    show:String(
      firstValue(
        e,
        ["show","showtime","horaShow"]
      )
    ),

    contactName:String(
      firstValue(
        e,
        [
          "contactName",
          "contact",
          "contacto",
          "nombreContacto"
        ]
      )
    ).toUpperCase(),

    contactPhone:String(
      firstValue(
        e,
        [
          "contactPhone",
          "phone",
          "telefono",
          "teléfono",
          "telefonoContacto"
        ]
      )
    ),

    status:String(
      firstValue(
        e,
        ["status","estado"],
        "Confirmado"
      )
    ),

    payment:String(
      firstValue(
        e,
        ["payment","pago"],
        "Pendiente"
      )
    ),

    amount:Number(
      firstValue(
        e,
        ["amount","monto"],
        0
      )
    ) || 0,

    notes:String(
      firstValue(
        e,
        ["notes","notas"]
      )
    ).toUpperCase()
  };
}

function extractArray(parsed){
  if(Array.isArray(parsed)){
    return parsed;
  }

  if(!parsed || typeof parsed !== "object"){
    return null;
  }

  const keys = [
    "events",
    "data",
    "D",
    "prestaciones",
    "items",
    "agenda"
  ];

  for(const key of keys){
    if(Array.isArray(parsed[key])){
      return parsed[key];
    }
  }

  return null;
}

function looksLikeEvent(item){
  if(!item || typeof item !== "object"){
    return false;
  }

  return Boolean(
    item.date ||
    item.fecha ||
    item.artist ||
    item.artista ||
    item.band ||
    item.banda
  );
}

/* =========================
   CARGA SEGURA Y MIGRACIÓN
========================= */

function loadEvents(){

  try{
    const saved =
      JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

    if(Array.isArray(saved)){
      return saved
        .filter(looksLikeEvent)
        .map(normalizeEvent);
    }
  }catch(error){}

  let candidates = [];

  for(let i=0;i<localStorage.length;i++){

    const key = localStorage.key(i);

    if(!key || key === STORAGE_KEY){
      continue;
    }

    try{
      const parsed =
        JSON.parse(localStorage.getItem(key));

      const arr = extractArray(parsed);

      if(arr && arr.some(looksLikeEvent)){
        candidates.push(...arr);
      }

    }catch(error){}
  }

  const unique = [];
  const signatures = new Set();

  candidates
    .filter(looksLikeEvent)
    .map(normalizeEvent)
    .forEach(e => {

      const signature = [
        e.date,
        e.artist,
        e.place,
        e.show
      ].join("|");

      if(!signatures.has(signature)){
        signatures.add(signature);
        unique.push(e);
      }
    });

  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(unique)
    );
  }catch(error){}

  return unique;
}

function saveEvents(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state.events)
  );
}

/* =========================
   FECHAS Y FORMATO
========================= */

function todayString(){
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function formatDate(value){
  if(!value) return "SIN FECHA";

  const p = value.split("-");

  if(p.length !== 3){
    return value;
  }

  return p[2] + "/" + p[1] + "/" + p[0];
}

function formatMoney(value){
  return "$" +
    Number(value || 0).toLocaleString("es-CL");
}

function eventSort(a,b){
  const aa =
    (a.date || "9999-99-99") +
    " " +
    (a.show || "99:99");

  const bb =
    (b.date || "9999-99-99") +
    " " +
    (b.show || "99:99");

  return aa.localeCompare(bb);
}

/* =========================
   TELÉFONO / WHATSAPP / MAPA
========================= */

function telephoneNumber(value){
  return String(value || "")
    .replace(/[^\d+]/g,"");
}

function whatsappNumber(value){

  let number =
    String(value || "").replace(/\D/g,"");

  if(number.startsWith("00")){
    number = number.slice(2);
  }

  if(number.startsWith("0")){
    number = number.slice(1);
  }

  if(number.length === 9){
    number = "56" + number;
  }

  return number;
}

function callContact(phone){
  const number = telephoneNumber(phone);

  if(number){
    window.location.href = "tel:" + number;
  }
}

function whatsappContact(phone){
  const number = whatsappNumber(phone);

  if(number){
    window.location.href =
      "https://wa.me/" + number;
  }
}

function openMap(destination){
  if(!destination) return;

  window.location.href =
    "https://maps.apple.com/?q=" +
    encodeURIComponent(destination);
}

function clearForm(){

  $("eventForm").reset();

  $("fStatus").value = "Confirmado";
  $("fPayment").value = "Pendiente";
}

function openForm(id=null,presetDate=""){

  if(state.currentView !== "form"){
    state.returnView = state.currentView;
  }

  state.editingId =
    id === null ? null : String(id);

  clearForm();

  if(state.editingId){

    const e =
      state.events.find(
        item => item.id === state.editingId
      );

    if(!e) return;

    $("formTitle").innerHTML =
      "Editar<br>prestación";

    $("fDate").value = e.date;
    $("fArtist").value = e.artist;
    $("fPlace").value = e.place;
    $("fMeeting").value = e.meeting;
    $("fDeparture").value = e.departure;
    $("fTest").value = e.test;
    $("fShow").value = e.show;
    $("fContactName").value = e.contactName;
    $("fContactPhone").value = e.contactPhone;
    $("fStatus").value = e.status;
    $("fPayment").value = e.payment;
    $("fAmount").value =
      e.amount ? e.amount : "";
    $("fNotes").value = e.notes;

    $("deleteEvent").style.display = "block";

  }else{

    $("formTitle").innerHTML =
      "Nueva<br>prestación";

    $("fDate").value =
      presetDate || todayString();

    $("deleteEvent").style.display = "none";
  }

  "click",

);

$("eventForm").addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    const data = normalizeEvent({

      id:state.editingId || makeId(),

      date:$("fDate").value,

      artist:$("fArtist").value.trim(),

      place:$("fPlace").value.trim(),

      meeting:$("fMeeting").value.trim(),

      departure:$("fDeparture").value,

      test:$("fTest").value,

      show:$("fShow").value,

      contactName:
        $("fContactName").value.trim(),

      contactPhone:
        $("fContactPhone").value.trim(),

      status:$("fStatus").value,

      payment:$("fPayment").value,

      amount:$("fAmount").value,

      notes:$("fNotes").value.trim()
    });

    if(!data.date || !data.artist){
      alert("Falta ingresar FECHA o BANDA / ARTISTA.");
      return;
    }

    if(state.editingId){

      const index =
        state.events.findIndex(
          e => e.id === state.editingId
        );

      if(index >= 0){
        state.events[index] = data;
      }

    }else{
      state.events.push(data);
    }

    saveEvents();

    state.selectedDate = data.date;

    const parts = data.date.split("-");

    if(parts.length === 3){
      state.calendarYear = Number(parts[0]);
      state.calendarMonth = Number(parts[1]) - 1;
    }

    state.editingId = null;

    renderAll();

    showView(state.returnView || "home");
  }
);

$("deleteEvent").addEventListener(
  "click",
  function(){

    if(!state.editingId){
      return;
    }

    const e =
      state.events.find(
        item => item.id === state.editingId
      );

    const name =
      e && e.artist
        ? "\n\n" + e.artist
        : "";

    if(
      !confirm(
        "¿Eliminar esta prestación?" + name
      )
    ){
      return;
    }

    state.events =
      state.events.filter(
        item => item.id !== state.editingId
      );

    saveEvents();

    state.editingId = null;

    renderAll();

    showView(state.returnView || "home");
  }
);

/* =========================
   CALENDARIO
========================= */

const MONTHS = [
  "Enero","Febrero","Marzo",
  "Abril","Mayo","Junio",
  "Julio","Agosto","Septiembre",
  "Octubre","Noviembre","Diciembre"
];

function makeDateString(year,month,day){

  return (
    year + "-" +
    String(month+1).padStart(2,"0") + "-" +
    String(day).padStart(2,"0")
  );
}

function renderCalendar(){

  const year = state.calendarYear;
  const month = state.calendarMonth;

  $("calendarTitle").textContent =
    MONTHS[month] + " " + year;

  const grid = $("calendarGrid");
  grid.innerHTML = "";

  const firstOffset =
    (
      new Date(year,month,1).getDay() + 6
    ) % 7;

  const daysInMonth =
    new Date(year,month+1,0).getDate();

  for(let i=0;i<firstOffset;i++){

    const blank =
      document.createElement("div");

    blank.className = "day blank";
    grid.appendChild(blank);
  }

  for(let day=1;day<=daysInMonth;day++){

    const date =
      makeDateString(year,month,day);

    const events =
      state.events.filter(
        e => e.date === date
      );

    const button =
      document.createElement("button");

    button.type = "button";
    button.className = "day";
    button.textContent = day;

    if(events.length){

      button.classList.add("hasEvent");

      const dot =
        document.createElement("span");

      dot.className = "eventDot";
      button.appendChild(dot);
    }

    if(date === todayString()){
      button.classList.add("today");
    }

    if(date === state.selectedDate){
      button.classList.add("selected");
    }

    button.addEventListener(
      "click",
      function(){

        state.selectedDate = date;

        renderCalendar();
        renderSelectedDay(date);

        setTimeout(
          () => {
            $("dayDetails").scrollIntoView({
              behavior:"smooth",
              block:"start"
            });
          },
          50
        );
      }
    );

    grid.appendChild(button);
  }

  renderMonthList();

  if(
    state.selectedDate &&
    state.selectedDate.startsWith(
      year + "-" +
      String(month+1).padStart(2,"0")
    )
  ){
    renderSelectedDay(state.selectedDate);
  }else{
    $("dayDetails").innerHTML = "";
  }
}

function renderSelectedDay(date){

  const container = $("dayDetails");
  container.innerHTML = "";

  const title =
    document.createElement("div");

  title.className = "sectionTitle";
  title.style.marginTop = "0";
  title.textContent =

  container.appendChild(title);

  const events =
    state.events
      .filter(e => e.date === date)
      .slice()
      .sort(eventSort);

  if(!events.length){

    const empty =
      document.createElement("div");

    empty.className = "empty";
    empty.textContent =

    container.appendChild(empty);

  }else{

    events.forEach(e => {
      container.appendChild(

      );
    });
  }

  const add =
    document.createElement("button");

  add.type = "button";
  add.className = "primary";
  add.textContent =
    "+ AGREGAR OTRA PRESTACIÓN";

  add.addEventListener(

function renderMonthList(){

  const container = $("monthList");
  container.innerHTML = "";

  const prefix =

      .filter(
        e => e.date.startsWith(prefix)
      )
      .slice()

  if(!events.length){

    const empty =

    empty.className = "empty";

    );

function renderSummary(){

  const paid =
    state.events.filter(
      e => e.payment === "Pagado"
    );

  const pending =
    state.events.filter(
      e => e.payment !== "Pagado"
    );

  const confirmed =
    state.events.filter(
      e => e.status === "Confirmado"
    );

  const replacements =
    state.events.filter(
      e => e.status === "Reemplazo"
    );

  const paidMoney =
    paid.reduce(
      (total,e) =>
        total + Number(e.amount || 0),
      0
    );

  const pendingMoney =
    pending.reduce(
      (total,e) =>
        total + Number(e.amount || 0),
      0
    );

  $("sumTotal").textContent =
    state.events.length;

  $("sumConfirmed").textContent =
    confirmed.length;

  $("sumReplace").textContent =
    replacements.length;

  $("sumPaid").textContent =
    paid.length;

  $("sumPending").textContent =
    pending.length;

  $("sumPaidMoney").textContent =
    formatMoney(paidMoney);

  $("sumPendingMoney").textContent =
    formatMoney(pendingMoney);
}

$("exportBackup").addEventListener(

    const backup = {
      app:"KICHAN AGENDA",
      version:4,
      createdAt:new Date().toISOString(),
      events:state.events
    };

    const blob =
      new Blob(
        [
          JSON.stringify(
            backup,

            2
          )
        ],
        {
          type:"application/json"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    const date =
      todayString().replaceAll("-","");

    a.href = url;

    a.download =
      "kichan-agenda-respaldo-" +
      date +
      ".json";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(
      () => URL.revokeObjectURL(url),
      1000
    );
  }
);

  "click",
  function(){
    $("backupFile").click();
  }
);

$("backupFile").addEventListener(
  "change",
  function(){

    const file = this.files &&
      this.files[0];

    if(!file){
      return;
    }

    const reader =
      new FileReader();

    reader.onload = function(){

      try{

        const parsed =
          JSON.parse(reader.result);

        const arr =
          extractArray(parsed);

        if(!arr){
          throw new Error(
            "Formato no reconocido"
          );
        }

        const restored =
          arr
            .filter(looksLikeEvent)
            .map(normalizeEvent);

        if(
          !confirm(
            "Se encontraron " +
            restored.length +
            " prestaciones.\n\n" +
            "¿Restaurar este respaldo?"
          )
        ){
          $("backupFile").value = "";
          return;
        }

        state.events = restored;

        saveEvents();
        renderAll();

        alert(
          "Respaldo restaurado correctamente."
        );

      }catch(error){

        alert(
          "No se pudo restaurar este respaldo."
        );
      }

      $("backupFile").value = "";
    };

    reader.readAsText(file);
  }
);

/* =========================
   RENDER GENERAL
========================= */

function renderAll(){
  renderHome();
  renderCalendar();
  renderSummary();
}

/* =========================
   INICIO
========================= */

state.events = loadEvents();

renderAll();
showView("home");

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function(){});
    }
  );
}
