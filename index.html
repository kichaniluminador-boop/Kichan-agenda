<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Kichan Agenda</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--g:#e0b64c;--c:#151515;--l:#303030}*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;padding:28px 16px calc(120px + env(safe-area-inset-bottom))}.brand{text-align:center;color:var(--g);letter-spacing:6px}.title{text-align:center;font-size:42px;margin:20px 0 5px}.tag{text-align:center;color:#888;letter-spacing:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:35px 0}.stat,.box,.event,.form{background:var(--c);border:1px solid var(--l);border-radius:22px}.stat{text-align:center;padding:24px 5px}.stat b{display:block;color:var(--g);font-size:28px}.stat span,label{color:#999;font-size:11px}.primary{width:100%;border:0;border-radius:20px;background:var(--g);color:#111;font-weight:800;font-size:19px;padding:19px}button{font:inherit}.form{display:none;padding:16px;margin-top:18px}.form.open{display:block}label{display:block;margin:11px 3px 5px;text-transform:uppercase}input,select,textarea{width:100%;background:#0e0e0e;color:#fff;border:1px solid #383838;border-radius:14px;padding:14px;font-size:16px;min-width:0}textarea{min-height:85px}.g2,.g3{display:grid;gap:9px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}h2{font-size:17px;letter-spacing:4px;color:#bbb;margin:38px 6px 20px}.event{padding:16px;margin:12px 0}.event h3{margin:0 0 5px}.muted{color:#aaa}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #3a3a3a;border-radius:999px;padding:6px 9px;color:#bbb;font-size:12px}.money{color:var(--g);font-weight:700}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:1px solid #444;background:#1b1b1b;color:#fff;border-radius:12px;padding:11px}.actions .danger{color:#ef9292}.empty{text-align:center;color:#666;padding:45px}.view{display:none}.view.active{display:block}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{text-align:center;padding:22px}.box b{display:block;color:var(--g);font-size:23px}.box span{color:#999}.nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:#0b0b0bf2;border-top:1px solid #292929;padding:12px 8px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:28px}.nav button{border:0;background:none;color:#777;font-weight:700}.nav .active{color:var(--g)}@media(max-width:420px){.brand{font-size:14px}.g3{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><header><div class="brand">♛ KICHAN ILUMINADOR</div><h1 class="title">Agenda</h1><div class="tag">LUCES QUE HACEN HISTORIAS</div></header>
<section id="inicio" class="view active"><div class="stats"><div class="stat"><b id="total">0</b><span>EVENTOS</span></div><div class="stat"><b id="month">0</b><span>ESTE MES</span></div><div class="stat"><b id="next">—</b><span>PRÓXIMO</span></div></div><button class="primary" id="new">+ NUEVA PRESTACIÓN</button>
<form id="form" class="form"><input type="hidden" id="eid"><label>Fecha</label><input id="date" type="date" required><label>Banda / Artista</label><input id="artist" required placeholder="Ej: Luis Lambis"><label>Localidad / Lugar</label><input id="place" placeholder="Ej: Parque O'Higgins"><div class="g3"><div><label>Llegada</label><input id="arrival" type="time"></div><div><label>Prueba</label><input id="sound" type="time"></div><div><label>Show</label><input id="show" type="time"></div></div><div class="g2"><div><label>Estado</label><select id="status"><option>Confirmado</option><option>Por confirmar</option><option>Reemplazo</option></select></div><div><label>Pago</label><select id="payment"><option>Pendiente</option><option>Pagado</option></select></div></div><label>Monto $</label><input id="amount" type="number" inputmode="numeric" min="0"><label>Notas</label><textarea id="notes"></textarea><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary">GUARDAR</button></div></form><h2>PRÓXIMAS PRESTACIONES</h2><div id="events"></div></section>
<section id="calendario" class="view"><h2>CALENDARIO</h2><div id="calendar"></div></section><section id="resumen" class="view"><h2>RESUMEN</h2><div class="summary"><div class="box"><b id="paid">$0</b><span>Pagado</span></div><div class="box"><b id="pending">$0</b><span>Por cobrar</span></div><div class="box"><b id="confirmed">0</b><span>Confirmadas</span></div><div class="box"><b id="repl">0</b><span>Reemplazos</span></div></div></section></main>
<nav class="nav"><button data-v="inicio" class="active">⌂ Inicio</button><button data-v="calendario">▣ Calendario</button><button data-v="resumen">▥ Resumen</button></nav><script>
const K='kichan-agenda-v4',$=x=>document.getElementById(x);let D=JSON.parse(localStorage.getItem(K)||'[]');const cash=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(+n||0),fmt=d=>d?d.split('-').reverse().join('-'):'',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(D));render()}function close(){$('form').reset();$('eid').value='';$('form').classList.remove('open')}$('new').onclick=()=>{close();$('date').value=new Date().toISOString().slice(0,10);$('form').classList.add('open')};$('cancel').onclick=close;
$('form').onsubmit=e=>{e.preventDefault();let o={id:$('eid').value||Date.now()+'',date:$('date').value,artist:$('artist').value.trim(),place:$('place').value.trim(),arrival:$('arrival').value,sound:$('sound').value,show:$('show').value,status:$('status').value,payment:$('payment').value,amount:+$('amount').value||0,notes:$('notes').value.trim()},i=D.findIndex(x=>x.id===o.id);i<0?D.push(o):D[i]=o;save();close()};
function edit(id){let o=D.find(x=>x.id===id);for(let k in o)if($(k))$(k).value=o[k];$('eid').value=o.id;$('form').classList.add('open');scrollTo(0,350)}function dup(id){let o=D.find(x=>x.id===id);D.push({...o,id:Date.now()+'',payment:'Pendiente'});save()}function del(id){if(confirm('¿Eliminar esta prestación?')){D=D.filter(x=>x.id!==id);save()}}window.edit=edit;window.dup=dup;window.del=del;
function card(o){return `<article class="event"><h3>${esc(o.artist)}</h3><div class="muted">${esc(o.place)} · ${fmt(o.date)}</div><div class="chips">${o.arrival?`<span class="chip">Llegada ${o.arrival}</span>`:''}${o.sound?`<span class="chip">Prueba ${o.sound}</span>`:''}${o.show?`<span class="chip">Show ${o.show}</span>`:''}<span class="chip">${o.status}</span><span class="chip">${o.payment}</span></div><div class="money">${cash(o.amount)}</div>${o.notes?`<p>${esc(o.notes)}</p>`:''}<div class="actions"><button onclick="edit('${o.id}')">Editar</button><button onclick="dup('${o.id}')">Duplicar</button><button class="danger" onclick="del('${o.id}')">Eliminar</button></div></article>`}
function render(){let S=[...D].sort((a,b)=>a.date.localeCompare(b.date)),today=new Date().toISOString().slice(0,10),U=S.filter(x=>x.date>=today),now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');$('events').innerHTML=U.length?U.map(card).join(''):'<div class="empty">No hay prestaciones próximas</div>';$('calendar').innerHTML=S.length?S.map(card).join(''):'<div class="empty">No hay prestaciones guardadas</div>';$('total').textContent=D.length;$('month').textContent=D.filter(x=>x.date.startsWith(ym)).length;$('next').textContent=U[0]?fmt(U[0].date).slice(0,5):'—';$('paid').textContent=cash(D.filter(x=>x.payment==='Pagado').reduce((s,x)=>s+x.amount,0));$('pending').textContent=cash(D.filter(x=>x.payment==='Pendiente').reduce((s,x)=>s+x.amount,0));$('confirmed').textContent=D.filter(x=>x.status==='Confirmado').length;$('repl').textContent=D.filter(x=>x.status==='Reemplazo').length}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view,.nav button').forEach(x=>x.classList.remove('active'));$(b.dataset.v).classList.add('active');b.classList.add('active');scrollTo(0,0)});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
