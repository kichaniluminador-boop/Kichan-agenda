<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kichan Agenda</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{--gold:#e7b93f;--bg:#050505;--card:#141414;--line:#303030;--text:#f5f5f5;--muted:#969696}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:120px}
button,input,select,textarea{font:inherit}
.app{width:min(100%,760px);margin:auto;padding:24px 18px}
.brand{text-align:center;color:var(--gold);font-size:13px;font-weight:800;letter-spacing:6px;margin:14px 0 22px}
h1{text-align:center;font-size:52px;line-height:1;margin:28px 0 36px}
.view{display:none}.view.active{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.stat,.panel,.event,form{background:var(--card);border:1px solid var(--line);border-radius:26px}
.stat{text-align:center;padding:17px 5px}.stat b{display:block;color:var(--gold);font-size:26px}.stat small,.muted,label{color:var(--muted)}
.primary{width:100%;border:0;border-radius:19px;padding:17px;background:var(--gold);color:#050505;font-weight:800}
.section{margin:28px 4px 12px;color:var(--muted);font-size:13px;letter-spacing:2px}
.event{padding:20px;margin:11px 0}.event h3{font-size:21px;margin:6px 0}.gold{color:var(--gold)}.meta{margin:12px 0;color:var(--muted);font-size:13px;line-height:1.8}
.actions,.formbuttons{display:flex;gap:8px}.actions button,.formbuttons button{flex:1;border:1px solid var(--line);border-radius:15px;background:#090909;color:var(--text);padding:13px}.delete{color:#ff7777!important}
.panel{padding:22px 16px}.calendarhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.calendarhead h2{color:var(--gold);font-size:28px;margin:0}.calendarhead button{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#080808;color:var(--gold);font-size:23px}
.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week div{text-align:center;color:var(--muted);font-weight:700;padding:10px 0}
.day{aspect-ratio:1/1.12;min-width:0;border:1px solid transparent;border-radius:14px;background:#080808;color:var(--text)}.day.today{border-color:var(--gold)}.day.has{background:var(--gold);color:#050505;font-weight:800}.blank{visibility:hidden}
.monthlist{margin-top:24px}.line{display:flex;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid #292929}.line button{flex:1;border:0;background:none;color:var(--text);padding:0;text-align:left}
form{padding:22px 17px}.field{margin-bottom:17px}label{display:block;margin:0 5px 8px;font-size:12px}
input,select,textarea{display:block;width:100%;min-width:0;padding:15px;border:1px solid #383838;border-radius:17px;background:#080808;color:var(--text);-webkit-appearance:none;appearance:none}
textarea{height:95px;resize:none}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.formbuttons{margin-top:9px}.formbuttons .save{background:var(--gold);border-color:var(--gold);color:#050505;font-weight:800}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary div{background:#080808;border:1px solid var(--line);border-radius:18px;padding:18px}.summary b{display:block;color:var(--gold);font-size:24px}
.nav{position:fixed;z-index:20;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),720px);display:grid;grid-template-columns:repeat(3,1fr);padding:10px;background:#111;border:1px solid var(--line);border-radius:27px}
.nav button{border:0;background:none;color:#777;padding:9px}.nav button.active{color:var(--gold)}.hidden{display:none!important}
</style>
</head>
<body>
<main class="app">
<div class="brand">KICHAN ILUMINADOR</div>
<section id="home" class="view active">
<h1>Agenda</h1>
<div class="stats"><div class="stat"><b id="st">0</b><small>EVENTOS</small></div><div class="stat"><b id="sm">0</b><small>ESTE MES</small></div><div class="stat"><b id="sn">—</b><small>PRÓXIMO</small></div></div>
<button class="primary" onclick="newEvent()">＋ NUEVA PRESTACIÓN</button>
<div class="section">PRÓXIMAS PRESTACIONES</div><div id="list"></div>
</section>
<section id="calendar" class="view">
<h1>Calendario</h1><div class="panel">
<div class="calendarhead"><button onclick="moveMonth(-1)">‹</button><h2 id="ct"></h2><button onclick="moveMonth(1)">›</button></div>
<div class="week"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
<div class="days" id="days"></div><div class="monthlist" id="ml"></div></div>
</section>
<section id="summary" class="view">
  <h1>Resumen</h1>

<div class="panel">
  <div class="line">
    <span>📋 PRESTACIONES</span>
    <b class="gold" id="rt">0</b>
  </div>

  <div class="line">
    <span>✅ PAGADAS</span>
    <b class="gold" id="rp">0</b>
  </div>

<div class="line" id="pendientesPago" role="button" style="cursor:pointer">
    <span>⏳ PENDIENTES DE PAGO</span>
    <b class="gold" id="rpend">0</b>
  </div>

  <div class="line">
    <span>💰 TOTAL COBRADO</span>
    <b class="gold" id="rcobrado">$0</b>
  </div>

  <div class="line">
    <span>💵 TOTAL POR COBRAR</span>
    <b class="gold" id="rporcobrar">$0</b>
  </div>
</div>

  <div class="section">RESPALDO DE SEGURIDAD</div>

  <div class="panel">
    <button type="button" class="primary" onclick="exportBackup()">
      ⬆️ EXPORTAR RESPALDO
    </button>

    <button type="button" class="secondary" style="width:100%;margin-top:12px" onclick="document.getElementById('backupFile').click()">
      ⬇️ RESTAURAR RESPALDO
    </button>

    <input id="backupFile" type="file" accept=".json,application/json" hidden>
  </div>
</section>
<section id="editor" class="view">
<h1 id="ft">Nueva prestación</h1>
<form id="form">
<div class="field"><label>📅 FECHA</label><input id="date" type="date" required></div>
<div class="field"><label>🎤 BANDA / ARTISTA</label><input id="artist" required></div>
<div class="field"><label>📍 LOCALIDAD</label><input id="place"></div>
<div class="row"><div class="field"><label>📌 PUNTO DE ENCUENTRO</label><input id="meeting"></div><div class="field"><label>🚐 HORA SALIDA</label><input id="departure" type="time"></div></div>
<div class="field"><label>🎚️ PRUEBA DE SONIDO</label><input id="test" type="time"></div>
<div class="field"><label>🎤 HORA SHOW</label><input id="show" type="time"></div>
<div class="row"><div class="field"><label>✅ ESTADO</label><select id="status"><option>Confirmado</option><option>Por confirmar</option><option>Reemplazo</option><option>Cancelado</option></select></div><div class="field"><label>💰 PAGO</label><select id="payment"><option>Pendiente</option><option>Pagado</option></select></div></div>
<div class="field"><label>💵 MONTO $</label><input id="amount" type="number" min="0" inputmode="numeric"></div>
<div class="field"><label>📝 NOTAS</label><textarea id="notes"></textarea></div>
<div class="formbuttons"><button type="button" onclick="closeForm()">Cancelar</button><button class="save" type="submit">Guardar</button></div>
<div class="formbuttons"><button id="del" type="button" class="delete hidden" onclick="deleteCurrent()">Eliminar prestación</button></div>
</form></section>
</main>
<nav id="nav" class="nav"><button id="nh" class="active" onclick="view('home')">⌂<br>Inicio</button><button id="nc" onclick="view('calendar')">▣<br>Calendario</button><button id="ns" onclick="view('summary')">☰<br>Resumen</button></nav>
<script>
"use strict";
const KEY="kichan-agenda-v2",$=id=>document.getElementById(id);
let events=loadEvents(),editing=null,cal=new Date();cal.setDate(1);
function loadEvents(){
 const keys=[KEY,"kichan-agenda-2026","kichan-agenda-events-v1","kichan-agenda-v1"];
 let raw=[];
 for(const k of keys){try{const v=JSON.parse(localStorage.getItem(k)||"[]");if(Array.isArray(v)&&v.length){raw=v;break}}catch(e){}}
 return raw.map((e,i)=>({id:String(e.id??(`migrated-${i}-${Date.now()}`)),date:e.date||"",artist:e.artist||"",place:e.place||e.location||"",meeting:e.meeting||"",departure:e.departure||e.arrival||"",test:e.test||e.soundcheck||"",show:e.show||e.showtime||"",status:e.status||"Confirmado",payment:e.payment||"Pendiente",amount:Number(e.amount||0),notes:e.notes||""}));
}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function today(){return iso(new Date())}
function short(s){if(!s)return"";let a=s.split("-");return `${Number(a[2])}/${Number(a[1])}`}
function longDate(s){if(!s)return"";const d=new Date(s+"T12:00:00");return d.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(events))}
function view(v){["home","calendar","summary","editor"].forEach(x=>$(x).classList.toggle("active",x===v));$("nav").classList.toggle("hidden",v==="editor");["nh","nc","ns"].forEach(x=>$(x).classList.remove("active"));if(v==="home")$("nh").classList.add("active");if(v==="calendar")$("nc").classList.add("active");if(v==="summary")$("ns").classList.add("active");if(v!=="editor")render();window.scrollTo(0,0)}
function render(){let sorted=[...events].filter(e=>e.date).sort((a,b)=>a.date.localeCompare(b.date)),up=sorted.filter(e=>e.date>=today()&&e.status!=="Cancelado"),n=new Date(),prefix=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;$("st").textContent=events.length;$("sm").textContent=events.filter(e=>(e.date||"").startsWith(prefix)).length;$("sn").textContent=up[0]?short(up[0].date):"—";$("list").innerHTML=up.length?up.map(card).join(""):'<p class="muted">No hay prestaciones próximas.</p>';calendar();summary()}
function card(e){return `<article class="event"><span class="gold">${esc(longDate(e.date))}</span><h3>${esc(e.artist||"Sin artista")}</h3><div class="muted">📍 ${esc(e.place||"Sin localidad")}</div><div class="meta">📌 ${esc(e.meeting||"—")} · 🚐 Salida ${esc(e.departure||"—")}<br>🎚️ Prueba de sonido ${esc(e.test||"—")} · 🎤 Hora show ${esc(e.show||"—")}<br>✅ ${esc(e.status||"Confirmado")} · 💰 ${esc(e.payment||"Pendiente")}</div><div class="actions"><button onclick="editEvent('${e.id}')">Editar</button><button class="delete" onclick="removeEvent('${e.id}')">Eliminar</button></div></article>`}
function newEvent(d=today()){editing=null;$("form").reset();$("date").value=d;$("status").value="Confirmado";$("payment").value="Pendiente";$("ft").textContent="Nueva prestación";$("del").classList.add("hidden");view("editor")}
function editEvent(id){id=String(id);let e=events.find(x=>String(x.id)===id);if(!e)return;editing=id;["date","artist","place","meeting","departure","test","show","status","payment","amount","notes"].forEach(k=>$(k).value=e[k]??"");$("ft").textContent="Editar prestación";$("del").classList.remove("hidden");view("editor")}
$("form").addEventListener("submit",e=>{e.preventDefault();let o={id:editing||(`${Date.now()}-${Math.random().toString(36).slice(2,7)}`),date:$("date").value,artist:$("artist").value.trim(),place:$("place").value.trim(),meeting:$("meeting").value.trim(),departure:$("departure").value,test:$("test").value,show:$("show").value,status:$("status").value,payment:$("payment").value,amount:Number($("amount").value||0),notes:$("notes").value.trim()};if(!o.date||!o.artist)return;let i=events.findIndex(x=>String(x.id)===String(o.id));if(i<0)events.push(o);else events[i]=o;save();editing=null;view("home")});
function closeForm(){editing=null;view("home")}
function removeEvent(id){id=String(id);let e=events.find(x=>String(x.id)===id);if(e&&confirm(`¿Eliminar ${e.artist||"esta prestación"}?`)){events=events.filter(x=>String(x.id)!==id);save();render()}}
function deleteCurrent(){if(!editing)return;const id=String(editing),e=events.find(x=>String(x.id)===id);if(e&&confirm(`¿Eliminar ${e.artist||"esta prestación"}?`)){events=events.filter(x=>String(x.id)!==id);save();editing=null;view("home")}}
function moveMonth(n){cal.setMonth(cal.getMonth()+n);calendar()}
function calendar(){
  const M=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  let y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7,html="";
  $("ct").textContent=`${M[m]} ${y}`;

  for(let i=0;i<offset;i++){
    html+='<button type="button" class="day blank" disabled></button>';
  }

  for(let d=1;d<=last;d++){
    let date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    let count=events.filter(e=>e.date===date).length;
    html+=`<button type="button" class="day${date===today()?" today":""}${count?" has":""}" onclick="dayClick('${date}')">${d}${count?`<br>●${count>1?" "+count:""}`:""}</button>`;
  }

  $("days").innerHTML=html;

  let list=events
    .filter(e=>(e.date||"").startsWith(`${y}-${String(m+1).padStart(2,"0")}`))
    .sort((a,b)=>(a.date+(a.show||"")).localeCompare(b.date+(b.show||"")));

  $("ml").innerHTML=list.length
    ?list.map(e=>`
      <button
        type="button"
        onclick="editEvent('${e.id}')"
        style="width:100%;text-align:left;background:transparent;color:white;border:0;border-bottom:1px solid #292929;padding:18px 0;display:block;"
      >
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;">
          <div style="font-size:18px;line-height:1.3;min-width:0;">
            <b>${esc(short(e.date))} • ${esc(e.artist||"Sin artista")}</b>
          </div>
          <div style="color:#e7b93f;font-size:15px;white-space:nowrap;">
            🎚️ ${esc(e.test||"—")} • 🎤 ${esc(e.show||"—")}
          </div>
        </div>

        <div style="margin-top:8px;color:#b8b8b8;font-size:16px;">
          📍 ${esc(e.place||"—")}
        </div>

        ${e.notes?`
          <div style="margin-top:7px;color:#b8b8b8;font-size:15px;line-height:1.4;">
            📝 ${esc(e.notes)}
          </div>
        `:""}
      </button>
    `).join("")
    :'<p class="muted">No hay prestaciones este mes.</p>';
}
function dayClick(date){
  let list=events.filter(e=>e.date===date);

  if(list.length===0){
    newEvent(date);
    return;
  }

  $("ml").innerHTML=
    list.map(e=>`
      <div class="line">
        <button type="button" onclick="editEvent('${e.id}')">
          ${esc(e.artist||"SIN ARTISTA")}
        </button>
        <b class="gold">${esc(e.show||"—")}</b>
      </div>
    `).join("")
    +
    `<button type="button" class="primary" style="margin-top:16px" onclick="newEvent('${date}')">
      ＋ AGREGAR OTRA PRESTACIÓN
    </button>`;

  $("ml").scrollIntoView({behavior:"smooth",block:"start"});
}
function summary(){
  const rt = $("rt");
  const rp = $("rp");
  const rpend = $("rpend");
  const rcobrado = $("rcobrado");
  const rporcobrar = $("rporcobrar");

  const pagadas = events.filter(e => e.payment === "Pagado");
  const pendientes = events.filter(e => e.payment !== "Pagado");

  const monto = e => {
    const n = Number(String(e.amount || 0).replace(/[^\d]/g,""));
    return Number.isFinite(n) ? n : 0;
  };

  const totalCobrado = pagadas.reduce((s,e) => s + monto(e), 0);
  const totalPorCobrar = pendientes.reduce((s,e) => s + monto(e), 0);

  const pesos = n => "$" + n.toLocaleString("es-CL");

  if(rt) rt.textContent = events.length;
  if(rp) rp.textContent = pagadas.length;
  if(rpend) rpend.textContent = pendientes.length;
  if(rcobrado) rcobrado.textContent = pesos(totalCobrado);
  if(rporcobrar) rporcobrar.textContent = pesos(totalPorCobrar);
}
document.addEventListener("input",function(e){
  if((e.target.tagName==="INPUT"&&e.target.type==="text")||e.target.tagName==="TEXTAREA"){
    const inicio=e.target.selectionStart;
    const fin=e.target.selectionEnd;
    e.target.value=e.target.value.toUpperCase();
    if(inicio!==null)e.target.setSelectionRange(inicio,fin);
  }
}); 
// ===== RESPALDO DE AGENDA =====

function exportBackup(){
  const respaldo = {
    app: "KICHAN AGENDA",
    version: 1,
    fecha: new Date().toISOString(),
    events: events
  };

  const contenido = JSON.stringify(respaldo, null, 2);
  const blob = new Blob([contenido], {type:"application/json"});
  const url = URL.createObjectURL(blob);

  const enlace = document.createElement("a");
  enlace.href = url;

  const ahora = new Date();
  const nombre =
    "KICHAN-AGENDA-" +
    ahora.getFullYear() + "-" +
    String(ahora.getMonth()+1).padStart(2,"0") + "-" +
    String(ahora.getDate()).padStart(2,"0") +
    ".json";

  enlace.download = nombre;
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}


function importBackup(){
  const input = $("backupFile");

  input.value = "";
  input.click();
}


$("backupFile").addEventListener("change", function(){

  const archivo = this.files && this.files[0];
  if(!archivo) return;

  const lector = new FileReader();

  lector.onload = function(){

    try{

      const respaldo = JSON.parse(lector.result);

      let nuevosEventos;

      if(Array.isArray(respaldo)){
        nuevosEventos = respaldo;
      }
      else if(respaldo && Array.isArray(respaldo.events)){
        nuevosEventos = respaldo.events;
      }
      else{
        throw new Error("Formato incorrecto");
      }

      if(!confirm(
        "¿RESTAURAR ESTE RESPALDO?\n\n" +
        "La agenda actual será reemplazada por la información del respaldo."
      )){
        return;
      }

      events = nuevosEventos;

      save();
      render();
      calendar();
      summary();

      alert(
        "RESPALDO RESTAURADO CORRECTAMENTE\n\n" +
        events.length +
        " prestaciones recuperadas."
      );

      view("home");

    }catch(error){

 alert(
  "ERROR AL RESTAURAR:\n\n" +
  error.name + "\n" +
  error.message
);     

    }

  };

  lector.readAsText(archivo);

}); 
save();
render();
$("pendientesPago").addEventListener("click", function () {
  const lista = events
    .filter(e => e.payment !== "Pagado")
    .slice()
    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));

  if (!lista.length) {
    alert("NO HAY PRESTACIONES PENDIENTES DE PAGO");
    return;
  }

  const contenedor = $("m1");
  contenedor.innerHTML = "";

  const titulo = document.createElement("div");
  titulo.className = "section";
  titulo.textContent = "⌛ PENDIENTES DE PAGO";
  contenedor.appendChild(titulo);

  lista.forEach(e => {
    const fila = document.createElement("div");
    fila.className = "line";

    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "link";
    boton.textContent = e.artist || "SIN ARTISTA";

    boton.addEventListener("click", function () {
      edit(e.id);
    });

    const monto = document.createElement("b");
    monto.className = "gold";
    monto.textContent = "$" + Number(e.amount || 0).toLocaleString("es-CL");

    fila.appendChild(boton);
    fila.appendChild(monto);
    contenedor.appendChild(fila);
  });

  const volver = document.createElement("button");
  volver.type = "button";
  volver.className = "primary";
  volver.textContent = "← VOLVER AL RESUMEN";

  volver.addEventListener("click", function () {
    view("summary");
  });

  contenedor.appendChild(volver);
  contenedor.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
});  
</script>
</body></html>
